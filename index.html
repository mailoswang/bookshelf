<title>我的書櫃</title>
<script>(function(){var t=null;try{t=localStorage.getItem("bookshelf.theme")}catch(e){}if(t==="auto")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";else if(t!=="light")t="dark";document.documentElement.dataset.theme=t})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
 --gap:0px;
 --ink:#141414;--sub:#6d6d6d;--bg1:#f3f3f3;--surf:#fff;
 --glass:rgba(255,255,255,.86);--solid:rgba(0,0,0,.05);--line:rgba(0,0,0,.12);
 --acc:#e50914;--acc2:#f6121d;--accink:#fff;--danger:#c11119;--stk:#cfcfcf;--pop:#fff;
 --ph1:#5a5a5a;--ph2:#2b2b2b;
 --shadow:0 10px 28px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.08);
 color-scheme:light;
}
:root[data-theme="dark"]{
 --ink:#fff;--sub:#a3a3a3;--bg1:#141414;--surf:#1f1f1f;
 --glass:rgba(24,24,24,.82);--solid:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);
 --acc:#e50914;--acc2:#f6121d;--accink:#fff;--danger:#ff5f57;--stk:#333;--pop:#1f1f1f;
 --ph1:#3a3a3a;--ph2:#1b1b1b;
 --shadow:0 12px 34px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.4);
 color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg1);min-height:100%}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;color:var(--ink);background:transparent;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;left:0;right:0;top:0;bottom:calc(-1*var(--gap));z-index:-1;pointer-events:none;background:var(--bg1)}
.ic{display:block;flex:none}

/* ===== 霧面深色面板（Netflix 風格：平面、低彩度，只用紅色當重點）===== */
.glass{position:relative;background:var(--glass);border:1px solid var(--line);
 backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);box-shadow:var(--shadow)}
.pane.glass{background:var(--surf);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}

/* 底部懸浮列 */
.edge{position:fixed;left:0;right:0;bottom:0;height:145px;z-index:20;pointer-events:none;
 -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
 -webkit-mask-image:linear-gradient(to top,#000 0%,#000 20%,transparent 100%);mask-image:linear-gradient(to top,#000 0%,#000 20%,transparent 100%)}
.edge2{position:fixed;left:0;right:0;bottom:0;height:145px;z-index:21;pointer-events:none;
 background:linear-gradient(to top,color-mix(in srgb,var(--bg1) 92%,transparent) 0%,color-mix(in srgb,var(--bg1) 45%,transparent) 50%,color-mix(in srgb,var(--bg1) 0%,transparent) 100%)}
.short .edge2{background:linear-gradient(to top,var(--bg1) 0%,var(--bg1) 12%,color-mix(in srgb,var(--bg1) 55%,transparent) 55%,color-mix(in srgb,var(--bg1) 0%,transparent) 100%)}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 6px + var(--kb,0px));z-index:30;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;max-width:calc(100% - 20px)}
.dock:empty{display:none}
.ib{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:0;background:transparent;color:var(--ink);cursor:pointer;flex:none;padding:0;transition:transform .2s ease,background .2s}
.ib:hover{background:var(--solid)}
.ib:active{transform:scale(.92)}
.ib.sm{width:32px;height:32px;color:var(--sub)}
.ib.dng{color:var(--danger)}
.ib.pri{background:var(--acc);color:var(--accink);box-shadow:0 4px 14px rgba(229,9,20,.35)}
.dk{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;border:0;background:transparent;font:inherit;font-weight:700;font-size:.92rem;color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform .2s ease,background .2s}
.dk.pri{color:var(--accink);padding:0 20px 0 16px;background:var(--acc);box-shadow:0 6px 18px rgba(229,9,20,.4)}
.dk.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 40%,transparent)}
.dock .ib:active,.dock .dk:active{transform:scale(.94);background-color:var(--solid)}
.dock .dk.pri:active{background-color:var(--acc2)}
.dock.syncing [data-dk="cfg"]::after,.dock.err [data-dk="cfg"]::after{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--sub)}
.dock.syncing [data-dk="cfg"]::after{animation:pulse 1s ease-in-out infinite}
.dock.err [data-dk="cfg"]::after{background:var(--acc)}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;top:0;left:0;right:0;bottom:calc(-1*var(--gap));width:100%}
main{position:fixed;top:0;left:0;right:0;bottom:calc(-1*var(--gap));overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
 padding:calc(env(safe-area-inset-top,0px) + 22px) max(14px,calc((100% - 1080px)/2)) calc(124px + env(safe-area-inset-bottom,0px))}
main>*{animation:rise .4s ease both}
main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main>*{animation:none}.ib,.dk,.card{transition:none}}

/* buttons / fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;font-size:.95rem;color:var(--ink);cursor:pointer;padding:10px 18px;border-radius:6px;border:1px solid var(--line);background:var(--solid)}
.btn:active,.chip:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:var(--accink);border-color:transparent}
.btn.dng{color:var(--danger)}
.btn.pri.dng{background:var(--danger);color:#fff}
.btn.play{background:#fff;color:#141414;border-color:transparent}
.btn.dim{background:rgba(109,109,110,.7);color:#fff;border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.88rem;font-weight:500;color:var(--ink);cursor:pointer;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:transparent}
.chip.on{background:var(--ink);color:var(--bg1);border-color:transparent}
.chip.add{color:var(--sub);border-style:dashed}
.chip.warn{color:var(--accink);background:var(--acc);border-color:transparent}
.chipin{font:inherit;font-size:16px;width:130px;color:var(--ink);background:var(--solid);border:1px solid var(--acc);border-radius:999px;padding:6px 14px;outline:none}
label{display:block;font-size:.78rem;font-weight:500;color:var(--sub);margin:14px 0 5px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--solid);border:1px solid var(--line);border-radius:6px;padding:11px 14px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{border-color:var(--ink)}
input::placeholder{color:var(--sub);opacity:.8}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;padding:4px;gap:2px;border-radius:8px;background:var(--solid);border:1px solid var(--line);margin-top:14px}
.seg button{flex:1;font:inherit;font-weight:700;font-size:.9rem;color:var(--sub);background:transparent;border:0;border-radius:5px;padding:10px 0;cursor:pointer;transition:all .2s}
.seg button.on{color:var(--accink);background:var(--acc)}

/* panes */
.pane{border-radius:10px;padding:20px}
.pane+.pane{margin-top:14px}
h2{margin:0;font-size:1.25rem;font-weight:800;letter-spacing:.01em}
h3{margin:0;font-size:1.08rem;font-weight:800}
.sub{color:var(--sub);font-size:.9rem;margin:3px 0 0}
.msg{margin:12px 0 0;color:var(--sub);font-size:.88rem}
.msg.c{text-align:center}
.msg.warn{color:var(--danger)}

/* ===== 首頁大看板（hero）：模糊放大的封面當背景，往下漸層融進底色 ===== */
.hero{position:relative;isolation:isolate;overflow:hidden;margin:calc(-22px - env(safe-area-inset-top,0px)) -14px 0;
 padding:calc(env(safe-area-inset-top,0px) + 42px) 20px 26px;display:flex;flex-direction:column;align-items:center;text-align:center}
@media(min-width:1108px){.hero{margin-left:0;margin-right:0;border-radius:0 0 18px 18px}}
.hbg{position:absolute;inset:-40px;z-index:-2;filter:blur(30px) saturate(1.5) brightness(.75);transform:scale(1.15)}
.hbg .cover{width:100%;height:100%;aspect-ratio:auto;border-radius:0;box-shadow:none}
.hbg .ph{display:none}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
 background:linear-gradient(to bottom,color-mix(in srgb,var(--bg1) 35%,transparent) 0%,color-mix(in srgb,var(--bg1) 10%,transparent) 30%,color-mix(in srgb,var(--bg1) 70%,transparent) 70%,var(--bg1) 100%)}
.hcv{width:min(46vw,200px);cursor:pointer}
.hcv .cover{border-radius:6px;box-shadow:0 22px 50px rgba(0,0,0,.55),0 4px 12px rgba(0,0,0,.35)}
.hk{margin-top:18px;font-size:.74rem;font-weight:800;letter-spacing:.24em;color:var(--acc)}
.hero h1{margin:4px 0 0;font-size:clamp(1.7rem,7vw,2.6rem);font-weight:900;line-height:1.15;letter-spacing:.01em;overflow-wrap:anywhere;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.hm{margin:8px 0 0;font-size:.88rem;color:var(--sub);font-weight:500}
.hm i{font-style:normal;margin:0 7px;opacity:.6}
.hacts{display:flex;gap:10px;margin-top:16px}
.hacts .btn{min-width:120px}
.hero.sh{padding-bottom:10px}

.stats{display:flex;justify-content:center;gap:22px;margin:4px 0 18px;color:var(--sub);font-size:.8rem}
.stat{text-align:center}
.stat .n{white-space:nowrap;font-size:1.3rem;font-weight:800;line-height:1.1;color:var(--ink)}
.stat .n small{font-size:.75rem;font-weight:600;color:var(--sub);margin-right:3px}
.stat .l{margin-top:2px}
.tools{display:flex;gap:10px;margin-bottom:6px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:8px;border-radius:6px;padding:0 14px;height:46px;color:var(--sub);background:var(--solid);border:1px solid var(--line)}
.search input{border:0;background:transparent;padding:0;height:100%;box-shadow:none!important;border-radius:0}
.search .ib.pri{width:36px;height:36px;margin-right:-8px}

/* ===== 橫向捲動的列 ===== */
.row{margin-top:24px}
.rowh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rowh h3{flex:1}
.rail{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;margin:0 -14px;padding:2px 14px 8px;scroll-padding:0 14px;scroll-snap-type:x proximity;scrollbar-width:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail>*{flex:none;scroll-snap-align:start}
.rail>.card{width:min(29vw,150px)}
.rail .card .cv{margin:0}
.rail .card .cv.stack{margin:8px 8px 0 0}
.rail .card .t,.rail .card .s{display:none}
.tcard{position:relative;display:flex;align-items:flex-end;width:min(40vw,200px);cursor:pointer;padding-top:6px}
.tcard .num{flex:1;text-align:right;font-size:clamp(4.8rem,20vw,7.5rem);font-weight:900;line-height:.8;letter-spacing:-.06em;color:var(--bg1);-webkit-text-stroke:2px color-mix(in srgb,var(--ink) 60%,transparent);margin-right:-.1em;font-family:"Helvetica Neue",Arial,sans-serif}
.tcard .cv{flex:none;width:60%;position:relative;z-index:1}
.tcard:active{transform:scale(.97)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:18px 10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:24px 14px}}
.card{cursor:pointer;min-width:0;transition:transform .25s ease}
@media(hover:hover){.card:hover{transform:scale(1.05);z-index:2}}
.card:active{transform:scale(.97)}
.card .cv{margin:8px 8px 0 0}
.card .t{margin-top:8px;font-size:.86rem;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{margin-top:1px;font-size:.75rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--sub);padding:56px 24px;border-radius:10px;line-height:1.9}
.empty .ic{margin:0 auto 14px;color:var(--acc)}

/* cover: 圖片直接填滿外框 */
.cv{position:relative;isolation:isolate}
.cover{position:relative;width:100%;aspect-ratio:2/3;border-radius:4px;overflow:hidden;background:linear-gradient(160deg,var(--ph1),var(--ph2));box-shadow:0 4px 12px rgba(0,0,0,.3);display:flex;align-items:flex-end}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.cover .ph{position:relative;z-index:1;padding:10px;color:#fff;font-weight:800;font-size:.88rem;line-height:1.3;border-left:3px solid var(--acc)}
.cv.stack::before,.cv.stack::after{content:"";position:absolute;inset:0;border-radius:4px;background:var(--stk);z-index:-1}
.cv.stack::before{transform:translate(5px,-5px);opacity:.75}
.cv.stack::after{transform:translate(10px,-10px);opacity:.4}
.badge{position:absolute;right:6px;top:6px;z-index:2;min-width:22px;text-align:center;padding:1px 7px;border-radius:4px;font-size:.72rem;font-weight:800;color:#fff;background:rgba(0,0,0,.72)}
.ribbon{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:3px 0;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--acc);border-radius:0 0 4px 4px}

/* series */
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.pill{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:4px;background:var(--solid);border:1px solid var(--line)}
.sec{margin-top:26px}
.sech{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sech .cnt{flex:1;font-size:.8rem;color:var(--sub)}
.miss{margin:20px 4px -4px;font-size:.82rem;color:var(--acc);font-weight:600}
.sec.compact{margin-top:14px;padding:12px 14px 4px;border-radius:10px;background:var(--surf);border:1px solid var(--line)}
.sec.compact .sech{cursor:pointer;margin-bottom:6px}
.chev{display:grid;color:var(--sub);transition:transform .2s}.chev.up{transform:rotate(180deg)}
.strip{cursor:pointer;display:flex;overflow-x:auto;padding:8px 6px 16px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.mini{position:relative;flex:none;width:60px;margin-left:-24px;cursor:pointer;transition:transform .25s ease}
.mini:first-child{margin-left:0}.mini:hover{transform:translateY(-5px)}
.mini .cover{border-radius:3px;box-shadow:5px 0 12px rgba(0,0,0,.45)}
.sec.compact .grid{padding:6px 0 14px}

/* 對話框 */
.dlg{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px}
.dlg-b{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .2s ease both}
.dlg-p{position:relative;width:min(100%,340px);border-radius:12px;padding:24px 20px 18px;text-align:center;background:var(--pop);animation:pop .25s cubic-bezier(.2,.9,.3,1.1) both}
.dlg-t{font-size:1.1rem;font-weight:800}
.dlg-m{margin-top:8px;font-size:.92rem;color:var(--sub);line-height:1.6}
.dlg-i{margin-top:16px;text-align:center}
.dlg-a{display:flex;gap:10px;margin-top:22px}.dlg-a .btn{flex:1;padding:12px 10px}.dlg-a.col{flex-direction:column}
.dlg.out{animation:fadeout .17s ease forwards}
@keyframes fade{from{opacity:0}}@keyframes fadeout{to{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}}

/* edit */
.editgrid{display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:start}
.editgrid .cvcol .cv{margin:0}
@media(max-width:600px){.editgrid{grid-template-columns:1fr}.cvcol{width:150px;margin:0 auto}}
.irow{display:flex;gap:8px;align-items:center}
.ib.busy svg{animation:rot .8s linear infinite}

/* scan */
.scan{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:4/3;box-shadow:var(--shadow)}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reticle{position:absolute;left:9%;right:9%;top:26%;bottom:26%;border-radius:8px;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 999px rgba(0,0,0,.45);transition:border-color .2s,box-shadow .2s}
.reticle::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:rgba(229,9,20,.95);box-shadow:0 0 10px rgba(229,9,20,.9)}
.scan.ok .reticle{border-color:#46d369;box-shadow:0 0 0 999px rgba(20,90,50,.35),0 0 24px rgba(70,211,105,.7)}
.scan.dup .reticle{border-color:#ffc857;box-shadow:0 0 0 999px rgba(110,80,10,.35)}
.qh{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;font-weight:700;font-size:.92rem}
.qi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;background:var(--surf);border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.qc{width:36px;flex:none}
.qc .cover{border-radius:3px}
.qc .ph{font-size:.5rem;padding:4px;border-left-width:2px}
.qm{flex:1;min-width:0}
.qt{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qs{font-size:.78rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qs.bad{color:var(--danger)}
.qd{display:grid;place-items:center;color:#46d369;width:24px}
.spin{display:block;width:16px;height:16px;border-radius:50%;border:2px solid color-mix(in srgb,var(--acc) 25%,transparent);border-top-color:var(--acc);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 82px + var(--kb,0px));transform:translateX(-50%);z-index:40;padding:10px 20px;border-radius:6px;font-size:.9rem;font-weight:600;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;animation:rise .25s ease both}
</style>
</head>
<body>
<main id="app"></main>
<div class="edge"></div><div class="edge2"></div>
<nav class="dock glass" id="dock"></nav>
<script>
// ===== 設定 =====
// 書籍資料查詢代理。留空即可：在「設定」頁填入 Worker 網址後，會自動拿它來查詢 ISBN。
const PROXY = "https://isbn-lookup.yus1ferwang.workers.dev/?code="; // 例："https://isbn-lookup.你的帳號.workers.dev/?code="
const ZX_URL="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";

// ===== 圖示 =====
const I={
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 back:'<path d="m15 18-6-6 6-6"/>',
 sliders:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
 scan:'<path d="M3 8V6a3 3 0 0 1 3-3h2M16 3h2a3 3 0 0 1 3 3v2M21 16v2a3 3 0 0 1-3 3h-2M8 21H6a3 3 0 0 1-3-3v-2M8 8v8M12 8v8M16 8v8"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>',
 check:'<path d="m5 12 5 5 9-9"/>',
 pencil:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
 download:'<path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/>',
 upload:'<path d="M12 15V3m0 0L8 7m4-4 4 4M4 21h16"/>',
 book:'<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M8 7h8"/>',
 sort:'<path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3"/>',
 off:'<path d="M18 6 6 18M6 6l12 12"/>',
 chev:'<path d="m6 9 6 6 6-6"/>',
 bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
 refresh:'<path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/>'
};
const ic=(n,s=20)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

// ===== 資料 =====
const KEY="bookshelf.v1",TKEY="bookshelf.tombs",CKEY="bookshelf.sync",SKEY="bookshelf.sort",QKEY="bookshelf.quick";
let books=[],tombs=[],cfg={};
try{books=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
try{tombs=JSON.parse(localStorage.getItem(TKEY)||"[]")}catch(e){}
try{cfg=JSON.parse(localStorage.getItem(CKEY)||"{}")}catch(e){}
books.forEach(b=>{if(b.updatedAt==null)b.updatedAt=b.date||1;if(b.cover&&b.coverAt==null){b.coverAt=b.date||1;b._up=true}});
let rev=0;
let quotaWarned=false;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(books));localStorage.setItem(TKEY,JSON.stringify(tombs))}catch(e){if(!quotaWarned){quotaWarned=true;setTimeout(()=>toast("瀏覽器儲存空間已滿，最近的變更可能不會保存"),0)}}};
const saveCfg=()=>{try{localStorage.setItem(CKEY,JSON.stringify(cfg))}catch(e){}};
const save=()=>{rev++;persist();schedSync()};
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>(s||"").normalize("NFKC").replace(/[\s　]+/g,"").toLowerCase();
let draft=null,stream=null,timer=null,query="",sortMode="recent",quick=false;
try{sortMode=localStorage.getItem(SKEY)||"recent";quick=localStorage.getItem(QKEY)==="1"}catch(e){}
const SORTS={recent:"最近加入",title:"書名",author:"作者"};

function split(t){t=(t||"").trim();const m=t.match(/^(.*?)[\s　]*[（(]?\s*(?:第|vol\.?|VOL\.?|Vol\.?)?\s*(\d+)\s*(?:集|卷|冊|巻|話)?\s*[）)]?\s*$/);return m&&m[1].trim()?{base:m[1].trim(),vol:+m[2]}:{base:t,vol:null}}
// 移除書名裡的「（電子書）」「[電子書]」等標註，避免影響系列與集數判斷
const clean=s=>String(s||"").replace(/[\s　]*[（(\[【]\s*電子書\s*[）)\]】]/g,"").replace(/\s{2,}/g," ").trim();
// 書名後面的版本標註（首刷限定版、特裝版…）：括號內或結尾單獨一段，認得出來就從書名拆成「版本」
const EDKW="首刷|初回|限定|特裝|特別|附錄|書腰|書盒|豪華|典藏|珍藏|限量|盒裝|愛藏|紀念|贈品|附贈";
const RE_ED_B=new RegExp("[\\s　]*[（(\\[【]\\s*([^）)\\]】]*?(?:"+EDKW+")[^）)\\]】]*?)\\s*[）)\\]】]");
const RE_ED_T=new RegExp("[\\s　]+([^\\s（()）\\[\\]【】]*(?:"+EDKW+")[^\\s（()）\\[\\]【】]*[版刷裝盒])$");
function splitEdition(t){t=String(t||"").trim();
 let m=t.match(RE_ED_B)||t.match(RE_ED_T);
 if(!m)return{title:t,edition:""};
 const rest=(t.slice(0,m.index)+t.slice(m.index+m[0].length)).replace(/\s{2,}/g," ").trim();
 return rest?{title:rest,edition:m[1].trim()}:{title:t,edition:""};
}
const skeyS=s=>(s||"").trim().toLowerCase();
const skey=b=>skeyS(b.series||b.title);
const catsOf=name=>[...new Set(books.filter(x=>skey(x)===skeyS(name)).map(x=>x.cat).filter(Boolean))];
// 由書名推測系列／集數／分類：已有系列名稱（取最長的前綴）優先，其次才從書名尾端的數字切出
function guessFromTitle(title){
 const t=splitEdition(clean(title)).title,nt=norm(t);
 const names=[...new Set(books.map(b=>(b.series||"").trim()).filter(Boolean))];
 let best=null;
 for(const n of names){const nn=norm(n);if(nn.length>=2&&nt.startsWith(nn)&&(!best||nn.length>norm(best).length))best=n}
 const sp=split(t);let series,vol;
 if(best){series=best;const m=nt.slice(norm(best).length).match(/(\d+)/);vol=m?+m[1]:sp.vol}
 else{series=sp.base;vol=sp.vol}
 let cat="";
 for(const c of catsOf(series)){if(nt.includes(norm(c))){cat=c;break}}
 return{series,vol,cat};
}
function groups(){const g={};books.forEach(b=>{(g[skey(b)||b.id]??=[]).push(b)});
 return Object.entries(g).map(([k,l])=>{l.sort((a,b)=>(a.vol??1e9)-(b.vol??1e9)||a.date-b.date);return{k,l,first:l[0],last:Math.max(...l.map(x=>x.date||0))}})}
function gaps(l){const v=[...new Set(l.map(b=>b.vol).filter(n=>Number.isInteger(n)&&n>0))].sort((a,b)=>a-b);
 if(v.length<2)return[];const out=[];for(let i=v[0];i<v[v.length-1];i++)if(!v.includes(i))out.push(i);return out.length>12?[...out.slice(0,12),"…"]:out}
(function(){let ch=false;
 for(const b of books){let t=clean(b.title),s=clean(b.series);
  const et=splitEdition(t),es=splitEdition(s);
  const ed=b.edition||et.edition||es.edition;t=et.title;s=es.title;
  if(t===b.title&&s===(b.series||"")&&(b.edition||"")===ed)continue;
  const sp=split(t);b.title=t;b.series=s?split(s).base:sp.base;if(b.vol==null)b.vol=sp.vol;if(ed)b.edition=ed;b.updatedAt=Date.now();ch=true}
 if(ch)persist()})();
function isbnOK(s){s=s.replace(/[-\s]/g,"");if(!/^97[89]\d{10}$/.test(s))return false;let n=0;for(let i=0;i<12;i++)n+=+s[i]*(i%2?3:1);return (10-n%10)%10==+s[12]}
// 沒有封面但有 ISBN 的書（例如匯入的），改向 Worker 的 /img/<ISBN> 取圖：只存網址，不佔瀏覽器儲存空間
// 封面載入失敗的書：記在本機，下次刷新時換一個網址參數強制重抓（避開瀏覽器快取的失敗結果）
const CFKEY="bookshelf.coverfail",STAMP=Date.now();
let coverRetry=new Set();
try{coverRetry=new Set(JSON.parse(localStorage.getItem(CFKEY)||"[]"));localStorage.setItem(CFKEY,"[]")}catch(e){}
window.__cf=id=>{try{const a=new Set(JSON.parse(localStorage.getItem(CFKEY)||"[]"));a.add(id);localStorage.setItem(CFKEY,JSON.stringify([...a]))}catch(e){}};
const autoCover=b=>{const w=(cfg.url||(PROXY?PROXY.replace(/\?.*$/,""):"")).replace(/\/+$/,"");const i=String(b.isbn||"").replace(/\D/g,"");return w&&/^(97[89]\d{10}|\d{10})$/.test(i)?w+"/img/"+i:""};
// 網址型封面（匯入的書）載入成功後存進瀏覽器的 Cache Storage；Worker 偶爾沒回應時，改用本機存的那份
const cbase=u=>String(u||"").replace(/[?#].*$/,"");
window.__cs=async img=>{try{if(!/^https?:/.test(img.src)||!window.caches)return;const c=await caches.open("bookshelf-covers"),k=cbase(img.src);if(await c.match(k))return;const r=await fetch(img.src,{cache:"force-cache"});if(r.ok&&/^image\//.test(r.headers.get("content-type")||"")&&(+r.headers.get("content-length")||0)<2e6)await c.put(k,r)}catch(e){}};
window.__ce=async img=>{try{if(window.caches){const m=await (await caches.open("bookshelf-covers")).match(cbase(img.dataset.u));if(m){img.onerror=null;img.src=URL.createObjectURL(await m.blob());return}}}catch(e){}
 window.__cf(img.dataset.id);const d=document.createElement("div");d.className="ph";d.textContent=img.dataset.t;img.replaceWith(d)};
const cover=b=>{let src=b.cover||autoCover(b);const base=src;if(src&&!/^data:/.test(src)&&coverRetry.has(b.id))src+=(src.includes("?")?"&":"?")+"r="+STAMP;
 return`<div class="cover">${src?`<img src="${esc(src)}" alt="" loading="lazy" decoding="async" data-id="${esc(b.id)}" data-u="${esc(base)}" data-t="${esc(b.pending?"ISBN "+b.isbn:(b.title||"無封面"))}" onload="window.__cs(this)" onerror="window.__ce(this)">`:`<div class="ph">${esc(b.pending?"ISBN "+b.isbn:(b.title||"無封面"))}</div>`}</div>`};

function toast(m){const t=document.createElement("div");t.className="toast glass";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1900)}
const setTitle=t=>{document.title=t==="我的書櫃"?t:t+"．我的書櫃"};
const sameIsbn=(a,b)=>{const x=String(a||"").replace(/\D/g,""),y=String(b||"").replace(/\D/g,"");return !!x&&x===y};
const offline=()=>navigator.onLine===false;

// 自訂對話框（取代瀏覽器內建的 alert／confirm／prompt）。回傳：確定→true（有輸入框則為輸入文字）、取消→null、自訂按鈕→其 v
function dlg(o){return new Promise(res=>{
 const w=document.createElement("div");w.className="dlg";
 const acts=o.actions||[...(o.cancel===false?[]:[{label:o.cancel||"取消",v:null}]),{label:o.ok||"確定",v:true,cls:"pri"+(o.danger?" dng":"")}];
 w.innerHTML=`<div class="dlg-b"></div><div class="dlg-p glass" role="dialog" aria-modal="true"><div class="dlg-t">${esc(o.title)}</div>${o.msg?`<div class="dlg-m">${esc(o.msg).replace(/\n/g,"<br>")}</div>`:""}${o.input!=null?`<input class="dlg-i" value="${esc(o.input)}" placeholder="${esc(o.placeholder||"")}" maxlength="40">`:""}<div class="dlg-a${acts.length>2?" col":""}">${acts.map((a,i)=>`<button class="btn ${a.cls||""}" data-i="${i}">${esc(a.label)}</button>`).join("")}</div></div>`;
 document.body.appendChild(w);
 const inp=w.querySelector(".dlg-i");let done=false;
 const key=e=>{if(e.key==="Escape")fin(null);else if(e.key==="Enter"&&inp){e.preventDefault();fin(true)}};
 const fin=v=>{if(done)return;done=true;document.removeEventListener("keydown",key);w.classList.add("out");setTimeout(()=>w.remove(),170);res(v===true&&inp?inp.value:v)};
 document.addEventListener("keydown",key);
 w.querySelector(".dlg-b").onclick=()=>fin(null);
 w.querySelectorAll(".dlg-a .btn").forEach(b=>b.onclick=()=>fin(acts[+b.dataset.i].v));
 (inp||w.querySelector(".btn.pri")||w.querySelector(".btn")).focus();if(inp)inp.select();
})}

// ===== 底部懸浮列（所有頁面的導覽與操作都集中在這裡）=====
let dockActs={};
function setDock(list){
 dockActs={};
 $("#dock").innerHTML=list.map(a=>{dockActs[a.id]=a.fn;
  return a.label?`<button class="dk ${a.cls||""}" data-dk="${a.id}" aria-label="${esc(a.label)}">${a.icon?ic(a.icon,20):""}<span>${esc(a.label)}</span></button>`
                 :`<button class="ib ${a.cls||""}" data-dk="${a.id}" aria-label="${esc(a.tip||a.id)}">${ic(a.icon)}</button>`}).join("");
}
const backBtn=()=>({id:"back",icon:"back",tip:"返回",fn:goBack});
const scanBtn=()=>({id:"scan",icon:"scan",label:"掃描入庫",cls:"pri",fn:()=>{sess=[];go("#/add")}});
const cfgBtn=()=>({id:"cfg",icon:"sliders",tip:"設定",fn:()=>go("#/settings")});

// ===== 路由 =====
let lastHash=null,hist=[],scanDockFn=null;
function trackHash(h){if(hist.length>1&&hist[hist.length-2]===h)hist.pop();else if(hist[hist.length-1]!==h)hist.push(h)}
function go(h,rep){if(location.hash===h){route();return}if(rep){hist.pop();location.replace(h)}else location.hash=h}
function parentOf(){const h=location.hash;
 if(h.startsWith("#/book/")){const b=books.find(x=>x.id===h.slice(7));if(b&&books.filter(x=>skey(x)===skey(b)).length>1)return"#/series/"+encodeURIComponent(skey(b));return"#/"}
 if(h==="#/edit/new")return draft&&draft.isbn?"#/add":"#/";
 return"#/"}
function goBack(){if(draft&&location.hash.startsWith("#/edit"))draft=null;if(hist.length>1)history.back();else go(parentOf())}
function stopScan(){clearTimeout(timer);timer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function route(){
 stopScan();scanDockFn=null;
 const raw=location.hash||"#/",h=raw.slice(1)||"/",p=h.split("/");
 trackHash(raw==="#"?"#/":raw);
 if(h!==lastHash){app.scrollTop=0;lastHash=h}
 if(h==="/")return shelf();
 if(p[1]==="series")return series(decodeURIComponent(p[2]));
 if(p[1]==="book")return edit(books.find(b=>b.id===p[2]),false);
 if(p[1]==="edit")return draft?edit(draft,true):go("#/",true);
 if(p[1]==="add")return scan();
 if(p[1]==="settings")return settings();
 shelf();
}

// ===== 書架（Netflix 風格：上方大看板，下面一列列橫向捲動）=====
const isNew=t=>(t||0)>Date.now()-7*864e5;
const hrefOf=x=>x.l.length>1?"#/series/"+encodeURIComponent(x.k):"#/book/"+x.first.id;
const card=(x,rib)=>{const f=x.first,multi=x.l.length>1;rib=rib===undefined?(isNew(x.last)?"新加入":""):rib;
 return`<div class="card" data-go="${hrefOf(x)}"><div class="cv${multi?" stack":""}">${cover(f)}${multi?`<span class="badge">${x.l.length}</span>`:""}${rib?`<span class="ribbon">${esc(rib)}</span>`:""}</div><div class="t">${esc(f.series||(f.pending?"ISBN "+f.isbn:f.title))}</div><div class="s">${esc(f.author||"")}</div></div>`};
const bookCard=b=>`<div class="card" data-go="#/book/${b.id}"><div class="cv">${cover(b)}${b.vol!=null?`<span class="badge">第 ${b.vol} 集</span>`:""}${isNew(b.date)?`<span class="ribbon">新加入</span>`:""}</div><div class="t">${esc(b.pending?"ISBN "+b.isbn:b.title)}</div></div>`;
const rail=(title,items)=>items.length?`<section class="row"><div class="rowh"><h3>${esc(title)}</h3></div><div class="rail">${items.join("")}</div></section>`:"";
let heroK=null;
function hero(x){
 const f=x.first,multi=x.l.length>1,miss=gaps(x.l),href=hrefOf(x);
 const meta=[f.author,multi?x.l.length+" 本":(f.vol!=null?"第 "+f.vol+" 集":""),miss.length?"缺第 "+miss.join("、")+" 集":""].filter(Boolean);
 return`<section class="hero"><div class="hbg" aria-hidden="true">${cover(f)}</div><div class="hcv" data-go="${href}">${cover(f)}</div>
  <div class="hk">${isNew(x.last)?"最新收藏":"精選收藏"}</div><h1>${esc(f.series||(f.pending?"ISBN "+f.isbn:f.title))}</h1>
  ${meta.length?`<p class="hm">${meta.map(esc).join("<i>·</i>")}</p>`:""}
  <div class="hacts"><button class="btn play" data-go="${href}">${ic("book",18)}打開</button>${groups().length>1?`<button class="btn dim" id="shuf">${ic("refresh",18)}換一本</button>`:""}</div></section>`;
}
function renderRows(){
 const gs=groups().sort((a,b)=>b.last-a.last),multi=gs.filter(x=>x.l.length>1);
 const recent=[...books].sort((a,b)=>(b.date||0)-(a.date||0)).slice(0,20);
 const top=[...multi].sort((a,b)=>b.l.length-a.l.length||b.last-a.last).slice(0,10);
 const holes=gs.filter(x=>gaps(x.l).length);
 const au=new Map();gs.forEach(x=>{const a=(x.first.author||"").trim();if(a)(au.get(a)||au.set(a,[]).get(a)).push(x)});
 const authors=[...au.entries()].filter(e=>e[1].length>1).sort((a,b)=>b[1].length-a[1].length).slice(0,3);
 const singles=gs.filter(x=>x.l.length===1);
 $("#rows").innerHTML=
  rail("最近加入",recent.map(bookCard))+
  (top.length>=3?rail("收藏最多的系列",top.map((x,i)=>`<div class="tcard" data-go="${hrefOf(x)}"><span class="num">${i+1}</span><div class="cv">${cover(x.first)}</div></div>`)):"")+
  rail("我的系列",multi.map(x=>card(x)))+
  rail("缺集待補",holes.map(x=>card(x,"缺 "+gaps(x.l).filter(n=>n!=="…").length+(gaps(x.l).includes("…")?"+":"")+" 集")))+
  authors.map(([a,l])=>rail(a+" 的作品",l.map(x=>card(x)))).join("")+
  (singles.length>=3?rail("單行本",singles.map(x=>card(x))):"");
}
function renderGrid(){
 let g=groups();const q=norm(query);
 if(q)g=g.filter(x=>x.l.some(b=>norm([b.title,b.series,b.author,b.isbn].join(" ")).includes(q)));
 const nm=x=>x.first.series||x.first.title;
 if(sortMode==="title")g.sort((a,b)=>nm(a).localeCompare(nm(b),"zh-Hant"));
 else if(sortMode==="author")g.sort((a,b)=>(a.first.author||"~").localeCompare(b.first.author||"~","zh-Hant")||nm(a).localeCompare(nm(b),"zh-Hant"));
 else g.sort((a,b)=>b.last-a.last);
 $("#rows").hidden=!!q;$("#allt").textContent=q?"搜尋結果（"+g.length+"）":"全部藏書";
 $("#grid").innerHTML=g.length?g.map(x=>card(x)).join(""):`<p class="sub" style="grid-column:1/-1;text-align:center;padding:30px 0">找不到符合的書</p>`;
}
function shelf(){
 setTitle("我的書櫃");
 setDock([scanBtn(),cfgBtn()]);
 if(!books.length){app.innerHTML=`<div class="empty glass">${ic("book",44)}書架還是空的<br>點擊下方「掃描入庫」，<br>掃描書背的 ISBN 條碼，開始收藏第一本書。</div>`;return}
 const total=books.reduce((s,b)=>{const m=String(b.price||"").match(/^\s*(?:NT\$?|\$)?\s*([\d,]+)\s*$/i);return s+(m?+m[1].replace(/,/g,""):0)},0);
 const pend=books.filter(b=>b.pending||b.refill).length;
 const gs=groups().sort((a,b)=>b.last-a.last);
 const feat=gs.find(x=>x.k===heroK)||gs.find(x=>x.first.cover)||gs.find(x=>autoCover(x.first))||gs[0];heroK=feat.k;
 app.innerHTML=hero(feat)+`<div class="stats">
  <div class="stat"><div class="n">${gs.length}</div><div class="l">系列</div></div>
  <div class="stat"><div class="n">${books.length}</div><div class="l">藏書（本）</div></div>
  ${total?`<div class="stat"><div class="n">${total>=10000?(total/10000).toFixed(total>=100000?0:1)+"<small style=\"margin:0 0 0 2px\">萬</small>":total.toLocaleString()}</div><div class="l">總定價（NT$）</div></div>`:""}
 </div>
 ${pend?`<div style="margin-bottom:12px;text-align:center"><button class="chip warn" id="pend">${ic("refresh",15)}${pend} 本待補資料，點此重新查詢</button></div>`:""}
 <div class="tools"><label class="search" style="margin:0">${ic("search",18)}<input id="q" type="search" placeholder="搜尋書名、作者、ISBN" value="${esc(query)}" enterkeyhint="search"></label></div>
 <div id="rows"></div>
 <section class="row"><div class="rowh"><h3 id="allt">全部藏書</h3><button class="chip" id="sortb">${ic("sort",16)}<span id="sortl">${SORTS[sortMode]}</span></button></div><div class="grid" id="grid"></div></section>`;

 setTitle("系列");const f=g.first;
 const minD=c=>Math.min(...g.l.filter(b=>(b.cat||"")===c).map(b=>b.date||0));
 const cats=[...new Set(g.l.map(b=>b.cat||""))].sort((a,b)=>a===""?-1:b===""?1:minD(a)-minD(b));
 const many=cats.length>1;
 setDock([backBtn(),{id:"rn",icon:"pencil",tip:"重新命名系列",fn:()=>renameSeries(k)},scanBtn()]);
 const full=b=>`<div class="card" data-go="#/book/${b.id}"><div class="cv">${cover(b)}</div><div class="t">${b.vol!=null?"第 "+b.vol+" 集":esc(b.title)}</div></div>`;
 const sec=(c)=>{
  const l=g.l.filter(b=>(b.cat||"")===c),miss=gaps(l);
  const meta=`${l.length} 本${miss.length?` · 缺第 ${miss.join("、")} 集`:""}`;
  const rn=c?`<button class="ib sm" data-rncat="${esc(c)}" data-sk="${esc(k)}" aria-label="重新命名分類">${ic("pencil",16)}</button>`:"";
  if(!many)return`<section class="sec">${miss.length?`<p class="miss">缺第 ${miss.join("、")} 集</p>`:""}<div class="grid">${l.map(full).join("")}</div></section>`;
  const key=k+"|"+c,open=openCats.has(key);
  return`<section class="sec compact"><div class="sech" data-tog="${esc(key)}"><h3>${esc(c||"本篇")}</h3><span class="cnt">${meta}</span>${rn}<span class="chev${open?" up":""}">${ic("chev",18)}</span></div>`+
   (open?`<div class="grid">${l.map(full).join("")}</div>`
        :`<div class="strip" data-tog="${esc(key)}">${l.map((b,j)=>`<div class="mini" style="z-index:${l.length-j}" title="${esc(b.vol!=null?"第 "+b.vol+" 集":b.title)}">${cover(b)}</div>`).join("")}</div>`)+`</section>`;
 };

  <div class="pills"><span class="pill">${g.l.length} 本</span>${many?`<span class="pill">${cats.length} 個分類</span>`:""}</div></section>`+cats.map(sec).join("");
}

async function renameSeries(k){

 const old=l[0].series||l[0].title,nn=await dlg({title:"重新命名系列",input:old,placeholder:"系列名稱"});if(nn==null)return;
 const n=nn.trim();if(!n||n===old)return;

let sess=[];const seen=new Map(),failed=new Set();
function flash(kind){const el=$("#sc");if(!el)return;el.classList.remove("ok","dup");void el.offsetWidth;el.classList.add(kind);setTimeout(()=>el&&el.classList.remove(kind),500)}
let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.09)}catch(e){}}
function scan(){
 setTitle("掃描 ISBN");
 app.innerHTML=`<div class="scan" id="sc"><video id="v" playsinline muted></video><div class="reticle"></div></div>
 <p class="msg c" id="sm"></p>

 <div id="ql"></div>`;
 const msg=()=>{const sm=$("#sm");if(sm)sm.textContent=quick?"快速入庫已開啟：掃到條碼就自動入庫，資料在背景補齊。":"對準書背的 ISBN 條碼（978／979 開頭）"};
 scanDockFn=()=>setDock([backBtn(),
  {id:"quick",icon:"bolt",label:"快速入庫",cls:quick?"on":"",fn:()=>{quick=!quick;try{localStorage.setItem(QKEY,quick?"1":"0")}catch(e){}msg();scanDockFn&&scanDockFn()}},
  {id:"manual",icon:"pencil",tip:"手動建檔",fn:()=>{draft=blank();go("#/edit/new")}},
  ...(sess.length?[{id:"done",icon:"check",label:"完成 "+sess.length,cls:"pri",fn:()=>go("#/")}]:[])]);
 scanDockFn();msg();renderQ();
 const submit=()=>{const v=$("#mi").value.replace(/[-\s]/g,"");if(!isbnOK(v)){$("#sm").textContent="ISBN 格式或檢查碼不正確";return}
  $("#mi").value="";if(quick){seen.set(v,Date.now());quickAdd(v)}else{stopScan();found(v)}};
 $("#mg").onclick=submit;$("#mi").onkeydown=e=>{if(e.key==="Enter")submit()};
 const noCam=m=>{$("#sm").textContent=m;$("#sc").hidden=true};
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){noCam("此瀏覽器或連線方式無法使用鏡頭（需 HTTPS），請手動輸入 ISBN。");return}
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false}).then(async s=>{
  stream=s;const v=$("#v");if(!v){stopScan();return}
  v.setAttribute("playsinline","");v.muted=true;v.srcObject=s;try{await v.play()}catch(e){}
  const detect=await makeDetector();
  if(!detect){$("#sm").textContent="條碼辨識元件載入失敗，請手動輸入 ISBN。";return}
  const onCode=t=>{const now=Date.now();if((seen.get(t)||0)>now-6000)return;seen.set(t,now);if(quick)quickAdd(t);else{stopScan();found(t)}};
  const loop=async()=>{if(!stream)return;try{const t=await detect(v);if(t&&isbnOK(t))onCode(t)}catch(e){}if(stream)timer=setTimeout(loop,200)};loop();
 }).catch(()=>noCam("無法開啟鏡頭：請允許網站使用相機（iPhone：設定 → Safari → 相機），或改用手動輸入。"));
}
const loadScript=u=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function makeDetector(){
 if("BarcodeDetector" in window){
  try{const d=new BarcodeDetector({formats:["ean_13"]});return async v=>{const r=await d.detect(v);return r[0]&&r[0].rawValue}}catch(e){}
 }
 try{
  if(!window.ZXing)await loadScript(ZX_URL);
  const Z=window.ZXing,h=new Map();
  h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13]);h.set(Z.DecodeHintType.TRY_HARDER,true);
  const rd=new Z.MultiFormatReader();rd.setHints(h);
  const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
  return async v=>{
   if(!v.videoWidth)return null;
   const w=Math.min(960,v.videoWidth),k=w/v.videoWidth;cv.width=w;cv.height=Math.round(v.videoHeight*k);
   cx.drawImage(v,0,0,cv.width,cv.height);
   try{return rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))).getText()}catch(e){return null}
  };
 }catch(e){return null}
}

// 快速入庫：掃到就先存成「待補資料」，資料在背景（最多同時 3 本）查完再補上，鏡頭不中斷
function quickAdd(isbn){
 const ex=books.find(x=>sameIsbn(x.isbn,isbn));
 if(ex){flash("dup");toast("已收藏："+(ex.series||ex.title)+(ex.vol!=null?" 第 "+ex.vol+" 集":""));return}
 const b=blank();b.isbn=isbn;b.title="ISBN "+isbn;b.pending=true;
 books.push(b);sess.push(b.id);save();
 flash("ok");beep();try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
 renderQ();scanDockFn&&scanDockFn();enqueueFill(b.id);
}
const fq=[];let frun=0;
function enqueueFill(id){if(!fq.includes(id))fq.push(id);pumpFill()}
function pumpFill(){
 while(frun<3&&fq.length){const id=fq.shift();frun++;fillOne(id).catch(()=>{}).finally(()=>{frun--;pumpFill()})}
 if(frun===0&&!fq.length){const h=location.hash;if(h===""||h==="#/")shelf()}
}
async function fillOne(id){
 let b=books.find(x=>x.id===id);if(!b||(!b.pending&&!b.refill))return;
 if(offline()){renderQ();return}
 if(!b.pending){ // 先前查詢失敗、手動存檔的書：只補空白欄位，不動已填內容
  const r=await lookup(b.isbn,{quiet:true});b=books.find(x=>x.id===id);if(!b)return;
  if(!r){failed.add(id);return}
  const pe=splitEdition(clean(r.title||""));
  if(!b.author&&r.author)b.author=r.author;if(!b.price&&r.price)b.price=r.price;
  if(!b.publisher&&r.publisher)b.publisher=r.publisher;if(!b.pubDate&&r.pubDate)b.pubDate=normDate(r.pubDate);
  if(!b.edition&&pe.edition)b.edition=pe.edition;
  {const kc=keepCover(r.cover);if(!b.cover&&kc){b.cover=kc;b.coverAt=Date.now()}}
  delete b.refill;b.updatedAt=Date.now();save();return;
 }
 const r=await lookup(b.isbn,{quiet:true});let _ed="";if(r&&r.title){const pe=splitEdition(clean(r.title));r.title=pe.title;_ed=pe.edition}
 b=books.find(x=>x.id===id);if(!b)return;
 if(!r){failed.add(id);renderQ();return}
 const gs=guessFromTitle(r.title||"");
 Object.assign(b,{title:r.title||b.title,author:r.author||"",price:r.price||"",publisher:r.publisher||"",pubDate:normDate(r.pubDate),edition:_ed||b.edition||"",series:gs.series||r.title||"",vol:gs.vol,cat:gs.cat,pending:false,updatedAt:Date.now()});
 {const kc=keepCover(r.cover);if(kc){b.cover=kc;b.coverAt=Date.now()}}
 if(!b.author){const m=books.find(x=>x.id!==id&&skey(x)===skey(b)&&x.author);if(m)b.author=m.author}
 failed.delete(id);save();renderQ();
}
function fillPending(force){
 if(offline())return 0;if(force)failed.clear();
 let n=0;books.forEach(b=>{if((b.pending||b.refill)&&b.isbn&&!failed.has(b.id)){enqueueFill(b.id);n++}});return n;
}
function renderQ(){
 const el=$("#ql");if(!el)return;
 if(!sess.length){el.innerHTML="";return}
 const rows=sess.slice().reverse().map(id=>{const b=books.find(x=>x.id===id);if(!b)return"";
  const bad=b.pending&&failed.has(id),wait=b.pending&&!bad;
  const t=b.pending?"ISBN "+b.isbn:b.title;
  const s=bad?"查無資料，點此手動補齊":wait?(offline()?"離線中，連線後自動補資料":"查詢中…"):[(b.vol!=null?"第 "+b.vol+" 集":""),b.author].filter(Boolean).join(" · ");
  return`<div class="qi" data-go="#/book/${esc(b.id)}"><div class="qc">${cover(b)}</div><div class="qm"><div class="qt">${esc(t)}</div><div class="qs${bad?" bad":""}">${esc(s)}</div></div><span class="qd">${wait?'<i class="spin"></i>':bad?ic("off",18):ic("check",18)}</span></div>`}).join("");
 el.innerHTML=`<div class="qh"><span>本次已入庫 ${sess.length} 本</span><button class="chip" data-undo="1">${ic("back",14)}復原上一本</button></div>`+rows;
}
function undoLast(){
 const id=sess.pop();if(!id)return;
 books=books.filter(x=>x.id!==id);tombs=tombs.filter(t=>t.id!==id);tombs.push({id,deleted:true,updatedAt:Date.now()});

// ===== 查詢書籍資料 =====
const blank=()=>({id:"b"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),isbn:"",title:"",series:"",cat:"",vol:null,author:"",price:"",publisher:"",pubDate:"",edition:"",cover:"",note:"",date:Date.now()});
const tmo=(u,o={},ms=6000)=>{const c=new AbortController();setTimeout(()=>c.abort(),ms);return fetch(u,{...o,signal:c.signal})};
// 日期統一成 YYYY/MM/DD（只有年月就補 01）
const normDate=s=>{const m=String(s||"").match(/(\d{4})\D+(\d{1,2})(?:\D+(\d{1,2}))?/);return m?m[1]+"/"+m[2].padStart(2,"0")+"/"+(m[3]||"1").padStart(2,"0"):""};
// 把 Worker 抓到的封面縮小再存（最寬 420px、JPEG），避免幾百本書把瀏覽器的 5MB 儲存空間塞滿，造成「封面消失」
// Worker 回傳的封面是內嵌圖片（data URI）：不存進書裡，改由 ISBN 向 Worker 取圖；其他來源的網址型封面才保留
const keepCover=c=>c&&!/^data:/.test(c)?c:"";
const shrink=src=>new Promise(res=>{
 if(!/^data:image\//.test(src||"")||src.length<60000)return res(src);
 const im=new Image();im.onload=()=>{try{const s=Math.min(1,420/im.width),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);const o=c.toDataURL("image/jpeg",.78);res(o.length<src.length?o:src)}catch(e){res(src)}};
 im.onerror=()=>res(src);im.src=src});
const imgOK=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i.naturalWidth>40);i.onerror=()=>r(false);i.src=u});
const lookupBase=()=>PROXY||(cfg.url?cfg.url.replace(/\/+$/,"")+"/?code=":"");
const SRC=[
 ["自訂代理",async i=>{const b=lookupBase();if(!b)return null;const res=await tmo(b+i,{cache:"no-cache"},25000);if(res.status===404)return null;if(!res.ok)throw new Error("HTTP "+res.status);return await res.json()}],
 ["Google Books",async i=>{
  const j=await (await tmo("https://www.googleapis.com/books/v1/volumes?q=isbn:"+i)).json();const it=j.items&&j.items[0];if(!it)return null;
  const v=it.volumeInfo,p=it.saleInfo&&it.saleInfo.listPrice;
  const im=v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail);
  return{title:v.title+(v.subtitle?" "+v.subtitle:""),author:(v.authors||[]).join("、"),price:p?p.currencyCode+" "+p.amount:"",publisher:v.publisher||"",pubDate:normDate(v.publishedDate),cover:im?im.replace("http:","https:").replace("&edge=curl",""):""}}],
 ["Open Library",async i=>{
  const j=await (await tmo("https://openlibrary.org/api/books?format=json&jscmd=data&bibkeys=ISBN:"+i)).json();const v=j["ISBN:"+i];
  const c="https://covers.openlibrary.org/b/isbn/"+i+"-L.jpg?default=false";
  const hasC=await imgOK(c);
  if(!v&&!hasC)return null;
  return{title:v?v.title:"",author:v?(v.authors||[]).map(a=>a.name).join("、"):"",cover:hasC?c:""}}],
 ["NDL（日本國會圖書館）",async i=>{
  const x=new DOMParser().parseFromString(await (await tmo("https://ndlsearch.ndl.go.jp/api/opensearch?isbn="+i)).text(),"text/xml");
  const it=x.querySelector("item");const t=it&&it.getElementsByTagName("dc:title")[0];
  const c="https://ndlsearch.ndl.go.jp/thumbnail/"+i+".jpg";const hasC=await imgOK(c);
  if(!t&&!hasC)return null;
  const a=it&&it.getElementsByTagName("dc:creator")[0];
  return{title:t?t.textContent.trim():"",author:a?a.textContent.trim():"",cover:hasC?c:""}}]
];
let lastInfo="";
async function lookup(isbn,o={}){
 lastInfo="";
 if(offline()){lastInfo="目前離線";return null}
 const out={title:"",author:"",price:"",cover:"",publisher:"",pubDate:""},used=[];
 for(const [name,fn] of SRC){
  if(out.title&&out.cover&&out.author)break;
  if(!o.quiet){const sm=$("#sm");if(sm)sm.textContent="查詢中："+name+"…"}
  try{const r=await fn(isbn);if(!r)continue;let hit=false;
   for(const k in out)if(!out[k]&&r[k]){out[k]=r[k];hit=true}
   if(hit)used.push(name);else lastInfo+=name+"：沒有新資料；"}catch(e){lastInfo+=name+"："+(e&&e.name==="AbortError"?"逾時":(e&&e.message)||"連線失敗")+"；"}
 }
 if(!out.title&&!out.cover)return null;
 out._src=used.join(" + ");return out;
}
async function found(isbn){
 stopScan();
 const ex=books.find(x=>sameIsbn(x.isbn,isbn));
 if(ex){
  const where="「"+(ex.series||ex.title)+"」"+(ex.vol!=null?"第 "+ex.vol+" 集":"")+(ex.cat?"（"+ex.cat+"）":"");
  const v=await dlg({title:"這本書已經收藏了",msg:"ISBN "+isbn+" 已收藏在\n"+where,actions:[{label:"查看這本書",v:"view",cls:"pri"},{label:"仍要重複入庫",v:"dup"},{label:"繼續掃描",v:"again"}]});
  if(v==="view"){go("#/book/"+ex.id);return}
  if(v!=="dup"){scan();return}
 }
 $("#sm")&&($("#sm").textContent="辨識成功："+isbn+"，查詢書籍資料中…");
 const r=await lookup(isbn);if(r&&r.title)r.title=clean(r.title);draft=blank();let _ed="";if(r&&r.title){const pe=splitEdition(r.title);r.title=pe.title;_ed=pe.edition}draft.isbn=isbn;
 if(r){Object.assign(draft,{title:r.title||"",author:r.author||"",price:r.price||"",publisher:r.publisher||"",pubDate:normDate(r.pubDate),edition:_ed,cover:keepCover(r.cover),_src:r._src});
  const gs=guessFromTitle(draft.title);draft.series=gs.series;draft.vol=gs.vol;draft.cat=gs.cat;
  if(!draft.author){const m=books.find(x=>skey(x)===skeyS(gs.series)&&x.author);if(m)draft.author=m.author}}
 draft._miss=!r;draft._off=offline();go("#/edit/new");
}

 if(!b){go("#/",true);return}

 const ex=isNew&&b.isbn?books.find(x=>x.id!==b.id&&sameIsbn(x.isbn,b.isbn)):null;
 const names=[...new Set(books.map(x=>(x.series||"").trim()).filter(Boolean))];
 const notes=[
  b._miss?(b._off?"目前離線，無法查詢資料。可先手動填寫，之後連線再按 ISBN 旁的重新查詢。":"查無線上資料（或尚未連上查詢服務），請手動填寫並上傳封面。"):"",
  b.pending?"這本書的資料還沒補齊。連線後按 ISBN 旁的重新查詢，或直接手動填寫。":"",
  b._src?"資料來源："+b._src+"，請確認內容是否正確。":""].filter(Boolean).map(t=>`<p class="msg" style="margin:0 0 12px">${esc(t)}</p>`).join("");
 app.innerHTML=`<div class="pane glass">${notes}${ex?`<p class="msg warn" style="margin:0 0 12px">⚠ 這個 ISBN 已收藏在「${esc(ex.series||ex.title)}」${ex.vol!=null?"第 "+ex.vol+" 集":""}，確定要重複收藏嗎？</p>`:""}

// ===== 跨裝置同步（Cloudflare Worker + KV）=====
let syncing=false,again=false,syncTimer=null;
const isData=s=>typeof s==="string"&&s.startsWith("data:");
const pub=b=>{const o={...b};delete o._up;if(isData(o.cover))delete o.cover;return o};
const setSync=st=>{const el=$("#dock");if(!el)return;el.classList.toggle("syncing",st==="busy");el.classList.toggle("err",st==="err")};
function schedSync(){if(!cfg.url||!cfg.token)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(),1500)}
async function api(path,opt={}){
 const r=await fetch(cfg.url.replace(/\/+$/,"")+path,{...opt,headers:{authorization:"Bearer "+cfg.token,"content-type":"application/json"}});
 if(r.status===401)throw new Error("同步密碼不正確");
 if(r.status===501)throw new Error("Worker 尚未設定 KV 或 SYNC_TOKEN");
 if(!r.ok&&r.status!==404)throw new Error("伺服器錯誤（"+r.status+"）");
 return r;
}
async function sync(){
 if(!cfg.url||!cfg.token||offline())return;
 if(syncing){again=true;return}
 syncing=true;setSync("busy");const r0=rev;let failedSync=false;
 try{
  const sentIds=books.map(b=>b.id);
  const r=await api("/sync",{method:"POST",body:JSON.stringify({books:[...books.map(pub),...tombs]})});
  if(!r.ok)throw new Error("同步伺服器回應異常（"+r.status+"）");
  const merged=(await r.json()).books;
  // 伺服器回傳空白或不完整時不套用，避免本機的書（含封面）被清空
  if(!Array.isArray(merged)||(()=>{const have=new Set(merged.map(m=>m.id));return sentIds.some(id=>!have.has(id))})())throw new Error("同步伺服器回應不完整，已略過這次同步");
  const loc=new Map(books.map(b=>[b.id,b])),hc=new Map(),nb=[],nt=[];
  for(const m of merged){
   if(m.deleted){nt.push({id:m.id,deleted:true,updatedAt:m.updatedAt});continue}
   const l=loc.get(m.id);hc.set(m.id,!!m.hasCover);
   const rec={...m};delete rec.hasCover;
   if(!rec.cover||isData(rec.cover))rec.cover=(l&&l.cover)||"";
   rec._up=!!(l&&l._up&&l.coverAt===m.coverAt);
   nb.push(rec);
  }
  for(const b of nb)if(b._up&&isData(b.cover)){
   const u=await api("/cover/"+b.id,{method:"PUT",body:JSON.stringify({cover:b.cover})});
   if(u.ok){b._up=false;hc.set(b.id,true)}
  }
  const need=nb.filter(b=>{const l=loc.get(b.id);return hc.get(b.id)&&!b.cvUrl&&!b._up&&!(l&&isData(l.cover)&&l.coverAt===b.coverAt)});
  for(let i=0;i<need.length;i+=3)await Promise.all(need.slice(i,i+3).map(async b=>{
   const c=await api("/cover/"+b.id);if(c.ok){const j=await c.json();if(j.cover)b.cover=j.cover}
  }));
  if(rev!==r0){again=true;return}
  books=nb;tombs=nt;persist();
  cfg.last=Date.now();cfg.err="";saveCfg();
  const h=location.hash;if(h===""||h==="#/"||h.startsWith("#/series"))route();
 }catch(e){
  // 網路中斷（離線、逾時）不算錯誤，等恢復連線後會自動再同步
  if(!(e instanceof TypeError)&&e.name!=="AbortError"){failedSync=true;cfg.err=String(e.message||e);saveCfg()}
 }
 finally{syncing=false;setSync(failedSync?"err":"ok");if(again){again=false;setTimeout(sync,300)}}
}
function statusText(){
 if(!cfg.url||!cfg.token)return "尚未啟用同步。";
 if(offline())return "目前離線，連線後會自動同步。";
 return cfg.err?"上次同步失敗："+cfg.err:cfg.last?"連線正常，上次同步："+new Date(cfg.last).toLocaleString("zh-TW"):"尚未同步。";
}

// 鎖住整個網頁本身的拖動（iPhone 主畫面模式會把整頁一起往上推），只允許中間內容區捲動
(function(){let y0=0,x0=0;
 document.addEventListener("touchstart",e=>{y0=e.touches[0].clientY;x0=e.touches[0].clientX},{passive:true});
 document.addEventListener("touchmove",e=>{
  if(e.touches.length>1){e.preventDefault();return}
  const t=e.target;if(!t.closest)return;
  if(t.closest(".dlg-p textarea,textarea")&&false)return;
  const m=t.closest("main");if(!m){e.preventDefault();return}
  const dy=e.touches[0].clientY-y0,dx=e.touches[0].clientX-x0;
  if(Math.abs(dx)>Math.abs(dy)&&t.closest(".rail,.strip"))return;
  if((dy>0&&m.scrollTop<=0)||(dy<0&&m.scrollTop+m.clientHeight>=m.scrollHeight-1))e.preventDefault();
 },{passive:false});
 const reset=()=>{if(scrollX||scrollY)scrollTo(0,0)};
 addEventListener("scroll",reset,{passive:true});
 if(window.visualViewport)visualViewport.addEventListener("scroll",()=>{if(visualViewport.offsetTop>0&&!/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName||""))scrollTo(0,0)});
})();
// 主畫面模式偶爾可視高度會比螢幕矮一截（系統把狀態列高度扣掉）。偵測到時：先請系統重算，仍不行就把底部淡出收成實色，與下方留白接起來
const VP="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover";
let vpTry=0;
const isShort=()=>(navigator.standalone===true||matchMedia("(display-mode: standalone)").matches)&&screen.height-innerHeight>20&&matchMedia("(orientation: portrait)").matches;
function vpCheck(){
 document.documentElement.classList.toggle("short",isShort());
 if(!isShort()||vpTry>=2)return;vpTry++;
 const m=document.querySelector('meta[name="viewport"]');if(!m)return;
 m.content=VP+", height="+screen.height;
 setTimeout(()=>{if(isShort())m.content=VP;document.documentElement.classList.toggle("short",isShort())},300);
}
addEventListener("resize",()=>setTimeout(vpCheck,100));
addEventListener("pageshow",()=>{vpTry=0;vpCheck()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){vpTry=0;setTimeout(vpCheck,100)}});
setTimeout(vpCheck,100);
function diag(){
 const p=document.createElement("div");p.style.cssText="position:fixed;left:0;bottom:0;padding-bottom:env(safe-area-inset-bottom);visibility:hidden";document.body.appendChild(p);
 const sb=p.offsetHeight;p.remove();
 const vv=window.visualViewport;
 return"innerHeight "+innerHeight+"／螢幕 "+screen.height+"／visualViewport "+(vv?Math.round(vv.height):"-")+"／底部安全區 "+sb;
}
// ===== 初始化 =====
document.addEventListener("click",e=>{
 const dk=e.target.closest("[data-dk]");if(dk){const f=dockActs[dk.dataset.dk];f&&f();return}
 const th=e.target.closest("[data-th]");if(th){setTheme(th.dataset.th);document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b===th));return}
 if(e.target.closest("[data-undo]"))return undoLast();
 const rs=e.target.closest("[data-rnseries]");if(rs)return renameSeries(rs.dataset.rnseries);
 const rc=e.target.closest("[data-rncat]");if(rc)return renameCat(rc.dataset.sk,rc.dataset.rncat);
 const tg=e.target.closest("[data-tog]");if(tg){const k=tg.dataset.tog;openCats.has(k)?openCats.delete(k):openCats.add(k);return route()}
 const c=e.target.closest("[data-go]");if(c)go(c.dataset.go);
});
// 虛擬鍵盤出現時，讓底部懸浮列浮在鍵盤上方
if(window.visualViewport){const upd=()=>{const vv=visualViewport,ae=document.activeElement,typing=ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName);const d=innerHeight-vv.height-vv.offsetTop;document.documentElement.style.setProperty("--kb",(typing&&d>150?d:0)+"px")};visualViewport.addEventListener("resize",upd);visualViewport.addEventListener("scroll",upd);addEventListener("focusout",()=>setTimeout(upd,50))}
matchMedia("(prefers-color-scheme: dark)").addEventListener&&matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(themeMode()==="auto")applyTheme()});
addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync()});
addEventListener("online",()=>{failed.clear();sync();fillPending();renderQ()});
addEventListener("offline",()=>renderQ());
addEventListener("hashchange",route);
// 清除先前版本留下的離線快取與 Service Worker
if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>{rs.forEach(r=>r.unregister());if(rs.length&&window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)))}).catch(()=>{})}
applyTheme();route();sync();setTimeout(fillPending,1500);
</script>
