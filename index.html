<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的書櫃</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b3228;--sub:#8a7b6a;--bg1:#efe6d6;--bg2:#d9e0cf;--bg3:#ecd2c0;--glass:rgba(255,252,246,.48);--edge:rgba(255,255,255,.7);--acc:#8c5a3c;--shadow:0 10px 30px rgba(80,60,40,.15);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--ink:#efe6d8;--sub:#a99a86;--bg1:#241f1a;--bg2:#1f2a24;--bg3:#33231d;--glass:rgba(60,52,44,.45);--edge:rgba(255,255,255,.14);--acc:#e0a679;--shadow:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{color-scheme:dark;--ink:#efe6d8;--sub:#a99a86;--bg1:#241f1a;--bg2:#1f2a24;--bg3:#33231d;--glass:rgba(60,52,44,.45);--edge:rgba(255,255,255,.14);--acc:#e0a679;--shadow:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;color:var(--ink);background:var(--bg1);min-height:100vh;
background-image:radial-gradient(40vmax 40vmax at 10% 5%,var(--bg2),transparent 70%),radial-gradient(45vmax 45vmax at 95% 30%,var(--bg3),transparent 70%),radial-gradient(35vmax 35vmax at 30% 100%,var(--bg2),transparent 70%);background-attachment:fixed}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.5);border-radius:22px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:12px auto;max-width:1000px;width:calc(100% - 24px);padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:1.1rem;margin:0;font-weight:600;letter-spacing:.15em;flex:1}
button,.btn{font:inherit;color:var(--ink);cursor:pointer;border:1px solid var(--edge);background:var(--glass);backdrop-filter:blur(12px);border-radius:999px;padding:8px 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
button.pri{background:var(--acc);color:#fff;border-color:transparent}
button.dng{color:#b4472f}
main{max-width:1000px;margin:0 auto;padding:6px 12px 90px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px}
.card{cursor:pointer;text-align:center;padding:10px 10px 12px;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.cover{aspect-ratio:2/3;width:100%;border-radius:8px;object-fit:cover;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;font-size:.85rem;background:linear-gradient(145deg,#c9b79c,#a99274);color:#fff;box-shadow:0 6px 14px rgba(60,40,20,.25);position:relative;overflow:hidden}
.card .t{margin-top:8px;font-size:.85rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;font-size:.7rem;padding:2px 8px}
.empty{text-align:center;color:var(--sub);padding:70px 20px;line-height:2}
.pane{padding:20px;margin-top:6px}
.row{display:flex;gap:18px;flex-wrap:wrap}
.row>.cv{flex:0 0 150px;max-width:100%}
.row>.fm{flex:1 1 260px;min-width:0}
label{display:block;font-size:.78rem;color:var(--sub);margin:10px 0 3px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:rgba(255,255,255,.25);border:1px solid var(--edge);border-radius:12px;padding:9px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.sub{color:var(--sub);font-size:.9rem;margin:2px 0 0}
h2{margin:0;font-weight:600}
video{width:100%;border-radius:16px;background:#000;max-height:55vh;object-fit:cover}
.scanbox{position:relative}
.scanbox:after{content:"";position:absolute;left:12%;right:12%;top:50%;height:2px;background:rgba(255,80,60,.8);box-shadow:0 0 10px red}
.msg{margin:10px 0;color:var(--sub);font-size:.9rem}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;width:58px;height:58px;padding:0;font-size:1.8rem;border-radius:50%}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.row>.cv{flex-basis:200px}}
</style>
</head>
<body>
<header class="glass"><button id="back" hidden>←</button><h1 id="ttl">我的書櫃</h1><button id="cfg" title="同步與備份">⚙</button><button id="theme" title="切換深淺色">◐</button></header>
<main id="app"></main>
<button class="fab pri glass" id="fab" title="掃描入庫">＋</button>
<script>
// ===== 設定：書籍資料查詢代理（需自行架設後端，因瀏覽器跨網域限制無法直接爬取紀伊國屋／誠品）=====
// 代理需回傳 JSON: {title, author, price, cover(圖片網址或 data URI)}
const PROXY = "https://isbn-lookup.yus1ferwang.workers.dev/?code="; // 例："https://your-server.example/api/isbn?code="
const KEY="bookshelf.v1",TKEY="bookshelf.tombs",CKEY="bookshelf.sync";
let books=[],tombs=[],cfg={};
try{books=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
try{tombs=JSON.parse(localStorage.getItem(TKEY)||"[]")}catch(e){}
try{cfg=JSON.parse(localStorage.getItem(CKEY)||"{}")}catch(e){}
// 舊資料補上同步用欄位：updatedAt（最後修改時間）、coverAt（封面版本）
books.forEach(b=>{if(b.updatedAt==null)b.updatedAt=b.date||1;if(b.cover&&b.coverAt==null){b.coverAt=b.date||1;b._up=true}});
let rev=0;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(books));localStorage.setItem(TKEY,JSON.stringify(tombs))}catch(e){}};
const saveCfg=()=>{try{localStorage.setItem(CKEY,JSON.stringify(cfg))}catch(e){}};
const save=()=>{rev++;persist();schedSync()};
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let draft=null, stream=null, timer=null;

function split(t){t=(t||"").trim();const m=t.match(/^(.*?)[\s　]*[（(]?\s*(?:第|vol\.?|VOL\.?|Vol\.?)?\s*(\d+)\s*(?:集|卷|冊|巻|話)?\s*[）)]?\s*$/);return m&&m[1].trim()?{base:m[1].trim(),vol:+m[2]}:{base:t,vol:null}}
const skey=b=>(b.series||b.title||"").trim().toLowerCase();
function groups(){const g={};books.forEach(b=>{(g[skey(b)||b.id]??=[]).push(b)});
 return Object.entries(g).map(([k,l])=>{l.sort((a,b)=>(a.vol??1e9)-(b.vol??1e9)||a.date-b.date);return{k,l,first:l[0]}}).sort((a,b)=>Math.max(...b.l.map(x=>x.date))-Math.max(...a.l.map(x=>x.date)))}
function isbnOK(s){s=s.replace(/[-\s]/g,"");if(!/^97[89]\d{10}$/.test(s))return false;let n=0;for(let i=0;i<12;i++)n+=+s[i]*(i%2?3:1);return (10-n%10)%10==+s[12]}
function cover(b,badge){return b.cover?`<img class="cover" src="${esc(b.cover)}" alt="">`:`<div class="cover">${esc(b.title||"無封面")}${badge||""}</div>`}

function stopScan(){clearTimeout(timer);timer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function route(){
 stopScan();const h=location.hash.slice(1)||"/";const p=h.split("/");
 $("#back").hidden=h==="/";$("#fab").hidden=h!=="/";
 if(h==="/")return shelf();
 if(p[1]==="series")return series(decodeURIComponent(p[2]));
 if(p[1]==="book")return edit(books.find(b=>b.id===p[2]),false);
 if(p[1]==="edit")return draft?edit(draft,true):(location.hash="#/");
 if(p[1]==="add")return scan();
 if(p[1]==="settings")return settings();
 shelf();
}
function shelf(){
 $("#ttl").textContent="我的書櫃";const g=groups();
 if(!g.length){app.innerHTML=`<div class="empty glass">書架還是空的<br>點擊右下角「＋」掃描 ISBN 條碼，<br>開始收藏第一本書吧。</div>`;return}
 app.innerHTML=`<p class="sub" style="margin:0 6px 12px">${g.length} 個系列／作品 · ${books.length} 本藏書</p><div class="grid">`+g.map(x=>{
  const multi=x.l.length>1;
  return`<div class="card glass" data-go="${multi?"#/series/"+encodeURIComponent(x.k):"#/book/"+x.first.id}">${cover(x.first,multi?`<span class="badge">${x.l.length} 本</span>`:"")}${x.first.cover&&multi?`<span class="badge" style="margin:10px 16px">${x.l.length} 本</span>`:""}<div class="t">${esc(x.first.series||x.first.title)}</div></div>`}).join("")+`</div>`;
}
function series(k){
 const g=groups().find(x=>x.k===k);if(!g){location.hash="#/";return}
 const f=g.first;$("#ttl").textContent="系列";
 app.innerHTML=`<div class="pane glass"><h2>${esc(f.series||f.title)}</h2><p class="sub">${esc(f.author||"作者未填")} · 已收藏 ${g.l.length} 本</p></div><div class="grid" style="margin-top:16px">`+g.l.map(b=>`<div class="card glass" data-go="#/book/${b.id}">${cover(b)}<div class="t">${b.vol!=null?"第 "+b.vol+" 集":esc(b.title)}</div></div>`).join("")+`</div>`;
}
function scan(){
 $("#ttl").textContent="掃描 ISBN";
 app.innerHTML=`<div class="pane glass"><div class="scanbox"><video id="v" playsinline muted></video></div><p class="msg" id="sm">對準書背的 ISBN 條碼（978／979 開頭）…</p>
 <label>或手動輸入 ISBN</label><div style="display:flex;gap:8px"><input id="mi" inputmode="numeric" placeholder="9784..."><button class="pri" id="mg">查詢</button></div>
 <div class="acts"><button id="skip">略過，直接手動建檔</button></div></div>`;
 $("#mg").onclick=()=>{const v=$("#mi").value.replace(/[-\s]/g,"");isbnOK(v)?found(v):$("#sm").textContent="ISBN 格式或檢查碼不正確"};
 $("#skip").onclick=()=>{draft=blank();location.hash="#/edit/new"};
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$("#sm").textContent="此瀏覽器或連線方式無法使用鏡頭（需 HTTPS），請手動輸入 ISBN。";$("#v").hidden=true;return}
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false}).then(async s=>{
  stream=s;const v=$("#v");v.setAttribute("playsinline","");v.muted=true;v.srcObject=s;try{await v.play()}catch(e){}
  const detect=await makeDetector();
  if(!detect){$("#sm").textContent="條碼辨識元件載入失敗（可能離線），請手動輸入 ISBN。";return}
  const loop=async()=>{if(!stream)return;try{const t=await detect(v);if(t&&isbnOK(t)){stopScan();return found(t)}}catch(e){}timer=setTimeout(loop,200)};loop();
 }).catch(()=>{$("#sm").textContent="無法開啟鏡頭：請允許網站使用相機（iPhone：設定 → Safari → 相機），或改用手動輸入。";$("#v").hidden=true});
}
// 條碼辨識：優先用瀏覽器內建 BarcodeDetector（Android Chrome），Safari 沒有，改用 ZXing 後備
const loadScript=u=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function makeDetector(){
 if("BarcodeDetector" in window){
  try{const d=new BarcodeDetector({formats:["ean_13"]});return async v=>{const r=await d.detect(v);return r[0]&&r[0].rawValue}}catch(e){}
 }
 try{
  if(!window.ZXing)await loadScript("https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js");
  const Z=window.ZXing,h=new Map();
  h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13]);h.set(Z.DecodeHintType.TRY_HARDER,true);
  const rd=new Z.MultiFormatReader();rd.setHints(h);
  const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
  return async v=>{
   if(!v.videoWidth)return null;
   const w=Math.min(960,v.videoWidth),k=w/v.videoWidth;cv.width=w;cv.height=Math.round(v.videoHeight*k);
   cx.drawImage(v,0,0,cv.width,cv.height);
   try{return rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))).getText()}catch(e){return null}
  };
 }catch(e){return null}
}
const blank=()=>({id:"b"+Date.now().toString(36),isbn:"",title:"",series:"",vol:null,author:"",price:"",cover:"",note:"",date:Date.now()});
const tmo=(u,o={})=>{const c=new AbortController();setTimeout(()=>c.abort(),6000);return fetch(u,{...o,signal:c.signal})};
const imgOK=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i.naturalWidth>40);i.onerror=()=>r(false);i.src=u});
const SRC=[
 ["自訂代理",async i=>{if(!PROXY)return null;return await (await tmo(PROXY+i)).json()}],
 ["Google Books",async i=>{
  const j=await (await tmo("https://www.googleapis.com/books/v1/volumes?q=isbn:"+i)).json();const it=j.items&&j.items[0];if(!it)return null;
  const v=it.volumeInfo,p=it.saleInfo&&it.saleInfo.listPrice;
  const im=v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail);
  return{title:v.title+(v.subtitle?" "+v.subtitle:""),author:(v.authors||[]).join("、"),price:p?p.currencyCode+" "+p.amount:"",cover:im?im.replace("http:","https:").replace("&edge=curl",""):""}}],
 ["Open Library",async i=>{
  const j=await (await tmo("https://openlibrary.org/api/books?format=json&jscmd=data&bibkeys=ISBN:"+i)).json();const v=j["ISBN:"+i];
  const c="https://covers.openlibrary.org/b/isbn/"+i+"-L.jpg?default=false";
  const hasC=await imgOK(c);
  if(!v&&!hasC)return null;
  return{title:v?v.title:"",author:v?(v.authors||[]).map(a=>a.name).join("、"):"",cover:hasC?c:""}}],
 ["NDL（日本國會圖書館）",async i=>{
  const x=new DOMParser().parseFromString(await (await tmo("https://ndlsearch.ndl.go.jp/api/opensearch?isbn="+i)).text(),"text/xml");
  const it=x.querySelector("item");const t=it&&it.getElementsByTagName("dc:title")[0];
  const c="https://ndlsearch.ndl.go.jp/thumbnail/"+i+".jpg";const hasC=await imgOK(c);
  if(!t&&!hasC)return null;
  const a=it&&it.getElementsByTagName("dc:creator")[0];
  return{title:t?t.textContent.trim():"",author:a?a.textContent.trim():"",cover:hasC?c:""}}]
];
async function lookup(isbn){
 const out={title:"",author:"",price:"",cover:""},used=[];
 for(const [name,fn] of SRC){
  if(out.title&&out.cover&&out.author)break;
  const sm=$("#sm");if(sm)sm.textContent="查詢中："+name+"…";
  try{const r=await fn(isbn);if(!r)continue;let hit=false;
   for(const k in out)if(!out[k]&&r[k]){out[k]=r[k];hit=true}
   if(hit)used.push(name)}catch(e){}
 }
 if(!out.title&&!out.cover)return null;
 out._src=used.join(" + ");return out;
}
async function found(isbn){
 stopScan();$("#sm")&&($("#sm").textContent="辨識成功："+isbn+"，查詢書籍資料中…");
 const r=await lookup(isbn);draft=blank();draft.isbn=isbn;
 if(r){Object.assign(draft,{title:r.title||"",author:r.author||"",price:r.price||"",cover:r.cover||"",_src:r._src});const s=split(draft.title);draft.series=s.base;draft.vol=s.vol}
 else draft.note="";
 draft._miss=!r;location.hash="#/edit/new";
}
function edit(b,isNew){
 if(!b){location.hash="#/";return}
 $("#ttl").textContent=isNew?"確認書籍資料":"書籍詳情";
 const dup=isNew&&b.isbn&&books.some(x=>x.isbn===b.isbn);
 app.innerHTML=`<div class="pane glass">${b._miss?`<p class="msg">查無線上資料（或此環境擋住了對外連線），請手動填寫並上傳封面。</p>`:""}${b._src?`<p class="msg">資料來源：${esc(b._src)}，請確認內容是否正確。</p>`:""}${dup?`<p class="msg" style="color:#b4472f">⚠ 這個 ISBN 已在書架中，確定要重複收藏嗎？</p>`:""}
 <div class="row"><div class="cv"><div id="cvw">${cover(b)}</div><input type="file" id="fl" accept="image/*" hidden><button style="margin-top:10px;width:100%" id="fb">更換封面</button></div>
 <div class="fm"><label>ISBN</label><input id="f_isbn" value="${esc(b.isbn)}" inputmode="numeric">
 <label>書名</label><input id="f_title" value="${esc(b.title)}">
 <div class="two"><div><label>系列名稱</label><input id="f_series" value="${esc(b.series)}"></div><div><label>集數</label><input id="f_vol" type="number" value="${b.vol??""}"></div></div>
 <div class="two"><div><label>作者</label><input id="f_author" value="${esc(b.author)}"></div><div><label>建議售價</label><input id="f_price" value="${esc(b.price)}"></div></div>
 <label>備註</label><textarea id="f_note" rows="2">${esc(b.note)}</textarea></div></div>
 <div class="acts"><button class="pri" id="ok">${isNew?"確認入庫":"儲存變更"}</button>${isNew?"":`<button class="dng" id="del">移出收藏</button>`}<button id="cn">取消</button></div></div>`;
 const g=id=>$("#f_"+id);
 g("title").onblur=()=>{const s=split(g("title").value);if(!g("series").value)g("series").value=s.base;if(!g("vol").value&&s.vol!=null)g("vol").value=s.vol};
 $("#fb").onclick=()=>$("#fl").click();
 $("#fl").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,500/im.width),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);b.cover=c.toDataURL("image/jpeg",.8);b.coverAt=Date.now();b._up=true;$("#cvw").innerHTML=cover(b)};im.src=URL.createObjectURL(f)};
 $("#cn").onclick=()=>{if(isNew)draft=null;history.length>1?history.back():location.hash="#/"};
 if($("#del"))$("#del").onclick=()=>{if(confirm("確定要移出收藏？")){books=books.filter(x=>x.id!==b.id);tombs=tombs.filter(t=>t.id!==b.id);tombs.push({id:b.id,deleted:true,updatedAt:Date.now()});save();location.hash="#/"}};
 $("#ok").onclick=()=>{
  const title=g("title").value.trim();if(!title){alert("請輸入書名");return}
  const s=split(title);
  Object.assign(b,{isbn:g("isbn").value.trim(),title,series:g("series").value.trim()||s.base,vol:g("vol").value===""?s.vol:+g("vol").value,author:g("author").value.trim(),price:g("price").value.trim(),note:g("note").value});
  // 自動歸入既有系列：系列名稱相同（不分大小寫）即屬同系列，沿用既有作者
  const mate=books.find(x=>x.id!==b.id&&skey(x)===skey(b));if(mate&&!b.author)b.author=mate.author;
  b.updatedAt=Date.now();if(b.cover&&b.coverAt==null){b.coverAt=Date.now();b._up=true}
  delete b._miss;delete b._src;if(isNew){books.push(b);draft=null}save();
  location.hash=mate||books.some(x=>x.id!==b.id&&skey(x)===skey(b))?"#/series/"+encodeURIComponent(skey(b)):"#/";
 };
}
// ===== 跨裝置同步（Cloudflare Worker + KV）=====
let syncing=false,again=false,syncTimer=null;
const isData=s=>typeof s==="string"&&s.startsWith("data:");
const pub=b=>{const o={...b};delete o._up;if(isData(o.cover))delete o.cover;return o};
const setIcon=t=>{const el=$("#cfg");if(el)el.textContent=t};
function schedSync(){if(!cfg.url||!cfg.token)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(),1500)}
async function api(path,opt={}){
 const r=await fetch(cfg.url.replace(/\/+$/,"")+path,{...opt,headers:{authorization:"Bearer "+cfg.token,"content-type":"application/json"}});
 if(r.status===401)throw new Error("同步密碼不正確");
 if(r.status===501)throw new Error("Worker 尚未設定 KV 或 SYNC_TOKEN");
 if(!r.ok&&r.status!==404)throw new Error("伺服器錯誤（"+r.status+"）");
 return r;
}
async function sync(){
 if(!cfg.url||!cfg.token)return;
 if(syncing){again=true;return}
 syncing=true;setIcon("⟳");const r0=rev;
 try{
  const r=await api("/sync",{method:"POST",body:JSON.stringify({books:[...books.map(pub),...tombs]})});
  const merged=(await r.json()).books||[];
  const loc=new Map(books.map(b=>[b.id,b])),hc=new Map(),nb=[],nt=[];
  for(const m of merged){
   if(m.deleted){nt.push({id:m.id,deleted:true,updatedAt:m.updatedAt});continue}
   const l=loc.get(m.id);hc.set(m.id,!!m.hasCover);
   const rec={...m};delete rec.hasCover;
   if(!rec.cover||isData(rec.cover))rec.cover=(l&&l.cover)||"";
   rec._up=!!(l&&l._up&&l.coverAt===m.coverAt);
   nb.push(rec);
  }
  // 1) 上傳尚未同步的封面
  for(const b of nb)if(b._up&&isData(b.cover)){
   const u=await api("/cover/"+b.id,{method:"PUT",body:JSON.stringify({cover:b.cover})});
   if(u.ok){b._up=false;hc.set(b.id,true)}
  }
  // 2) 下載本機缺少或版本較舊的封面（一次 3 張）
  const need=nb.filter(b=>{const l=loc.get(b.id);return hc.get(b.id)&&!b._up&&!(l&&isData(l.cover)&&l.coverAt===b.coverAt)});
  for(let i=0;i<need.length;i+=3)await Promise.all(need.slice(i,i+3).map(async b=>{
   const c=await api("/cover/"+b.id);if(c.ok){const j=await c.json();if(j.cover)b.cover=j.cover}
  }));
  if(rev!==r0){again=true;return} // 同步期間使用者又改了資料：丟棄這次結果，重跑一次
  books=nb;tombs=nt;persist();
  cfg.last=Date.now();cfg.err="";saveCfg();
  const h=location.hash;if(h===""||h==="#/"||h.startsWith("#/series"))route();
 }catch(e){cfg.err=String(e.message||e);saveCfg()}
 finally{syncing=false;setIcon(cfg.err?"⚠":"⚙");if(again){again=false;setTimeout(sync,300)}}
}
function statusText(){
 if(!cfg.url||!cfg.token)return "尚未啟用同步。";
 return cfg.err?"上次同步失敗："+cfg.err:cfg.last?"上次同步：連線正常，"+new Date(cfg.last).toLocaleString("zh-TW"):"尚未同步。";
}
function settings(){
 $("#ttl").textContent="同步與備份";
 const base=cfg.url||(PROXY?PROXY.replace(/\?.*$/,""):"");
 app.innerHTML=`<div class="pane glass"><h2>跨裝置同步</h2><p class="sub">在每台裝置填入相同的 Worker 網址與同步密碼，書架會自動合併。</p>
 <label>Worker 網址</label><input id="s_url" value="${esc(base)}" placeholder="https://isbn-lookup.你的帳號.workers.dev" autocapitalize="off" autocorrect="off">
 <label>同步密碼（SYNC_TOKEN）</label><input id="s_tok" type="password" value="${esc(cfg.token||"")}" autocomplete="off">
 <div class="acts"><button class="pri" id="s_go">儲存並同步</button><button id="s_off">停用同步</button></div>
 <p class="msg" id="s_msg">${esc(statusText())}</p></div>
 <div class="pane glass" style="margin-top:16px"><h2>備份</h2><p class="sub">把藏書（含封面）存成檔案，或從備份檔還原。還原時只會加入較新或不存在的書。</p>
 <div class="acts"><button id="x_out">匯出備份</button><button id="x_in">匯入還原</button></div><input type="file" id="x_f" accept="application/json,.json" hidden></div>`;
 $("#s_go").onclick=async()=>{
  const url=$("#s_url").value.trim().replace(/\?.*$/,"").replace(/\/+$/,""),tok=$("#s_tok").value.trim();
  if(!/^https:\/\//.test(url)||!tok){$("#s_msg").textContent="請填入 https 開頭的 Worker 網址與同步密碼";return}
  cfg={url,token:tok};saveCfg();$("#s_msg").textContent="同步中…";
  books.forEach(b=>{if(isData(b.cover)&&b.coverAt!=null)b._up=true}); // 首次連線：本機封面全部補傳一次
  await sync();$("#s_msg")&&($("#s_msg").textContent=statusText());
 };
 $("#s_off").onclick=()=>{cfg={};saveCfg();$("#s_url").value="";$("#s_tok").value="";$("#s_msg").textContent="已停用同步（本機資料保留）。"};
 $("#x_out").onclick=()=>{
  const blob=new Blob([JSON.stringify({v:1,books,tombs})],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="bookshelf-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();
 };
 $("#x_in").onclick=()=>$("#x_f").click();
 $("#x_f").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
   const d=JSON.parse(await f.text());if(!Array.isArray(d.books))throw 0;
   const ids=new Map(books.map(b=>[b.id,b]));let n=0;
   for(const b of d.books){if(!b||!b.id)continue;const o=ids.get(b.id);
    if(!o||(b.updatedAt||b.date||0)>(o.updatedAt||0)){
     if(o)books=books.filter(x=>x.id!==b.id);
     tombs=tombs.filter(t=>t.id!==b.id);
     b.updatedAt??=b.date||Date.now();if(isData(b.cover)){b.coverAt??=b.updatedAt;b._up=true}
     books.push(b);n++}}
   save();alert("已還原 "+n+" 本書");
  }catch(err){alert("這不是有效的備份檔")}
  e.target.value="";
 };
}
$("#cfg").onclick=()=>location.hash="#/settings";
addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync()});
addEventListener("online",()=>sync());
document.addEventListener("click",e=>{const c=e.target.closest("[data-go]");if(c)location.hash=c.dataset.go});
$("#fab").onclick=()=>location.hash="#/add";
$("#back").onclick=()=>{if(draft&&location.hash.startsWith("#/edit"))draft=null;location.hash="#/"};
$("#theme").onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).colorScheme.includes("dark")||r.dataset.theme==="dark";r.dataset.theme=d?"light":"dark"};
addEventListener("hashchange",route);route();sync();
</script>
</body>
