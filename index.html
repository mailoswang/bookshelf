<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="書櫃">
<meta name="theme-color" content="#e9eff8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>我的書櫃</title>
<script>(function(){var t=null;try{t=localStorage.getItem("bookshelf.theme")}catch(e){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
 --gap:60px;
 --ink:#162033;--sub:#62718a;--bg1:#e9eff8;--bg2:#c3d6f0;--bg3:#d7e4f2;--bg4:#cfd8f3;
 --glass:linear-gradient(150deg,rgba(255,255,255,.55),rgba(255,255,255,.24));
 --solid:rgba(255,255,255,.5);--line:rgba(30,55,100,.13);
 --rim:rgba(255,255,255,.7);--spec:rgba(255,255,255,.9);--spec2:rgba(255,255,255,.45);--glow:rgba(255,255,255,.28);
 --rimg:linear-gradient(145deg,rgba(255,255,255,.98) 0%,rgba(255,255,255,.3) 24%,rgba(255,255,255,0) 50%,rgba(255,255,255,.2) 78%,rgba(255,255,255,.8) 100%);
 --acc:#1e3a68;--acc2:#35609f;--accink:#fff;--danger:#c0462f;--stk:#c2cfe3;--pop:rgba(255,255,255,.86);
 --shadow:0 12px 32px rgba(25,45,90,.16),0 2px 6px rgba(25,45,90,.08);
 color-scheme:light;
}
:root[data-theme="dark"]{
 --ink:#e7eef9;--sub:#8c9db8;--bg1:#070d19;--bg2:#0f2547;--bg3:#14203a;--bg4:#1a2250;
 --glass:linear-gradient(150deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
 --solid:rgba(255,255,255,.09);--line:rgba(255,255,255,.12);
 --rim:rgba(255,255,255,.14);--spec:rgba(255,255,255,.32);--spec2:rgba(255,255,255,.12);--glow:rgba(255,255,255,.05);
 --rimg:linear-gradient(145deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,.12) 24%,rgba(255,255,255,0) 50%,rgba(255,255,255,.08) 78%,rgba(255,255,255,.4) 100%);
 --acc:#8db3ec;--acc2:#b0cdf6;--accink:#0a1830;--danger:#ff8a73;--stk:#25344f;--pop:rgba(16,28,52,.88);
 --shadow:0 14px 38px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
 color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg1);min-height:100%}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;color:var(--ink);background:transparent;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;left:0;right:0;top:0;bottom:calc(-1*var(--gap));z-index:-1;pointer-events:none;
 background:radial-gradient(120% 40% at 50% 0%,color-mix(in srgb,var(--bg2) 55%,transparent),transparent 75%),var(--bg1)}
.ic{display:block;flex:none}

/* ===== Liquid Glass：模糊 + 飽和 + 鏡面高光 + 邊緣漸層光 ===== */
.glass{position:relative;background:var(--glass);
 backdrop-filter:blur(22px) saturate(190%) brightness(1.06);-webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.06);
 box-shadow:var(--shadow),inset 0 0 0 .5px var(--rim),inset 2px 2.5px 4px -2px var(--spec),inset -2px -2.5px 4px -2px var(--spec2),inset 0 0 26px var(--glow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:var(--rimg);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
 mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.pane.glass{--glass:linear-gradient(150deg,rgba(255,255,255,.66),rgba(255,255,255,.34))}
:root[data-theme="dark"] .pane.glass{--glass:linear-gradient(150deg,rgba(255,255,255,.17),rgba(255,255,255,.07))}

/* 底部懸浮列 */
.edge{position:fixed;left:0;right:0;bottom:calc(-1*var(--gap));height:120px;z-index:20;pointer-events:none;
 -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
 -webkit-mask-image:linear-gradient(to top,#000 0%,#000 25%,transparent 100%);mask-image:linear-gradient(to top,#000 0%,#000 25%,transparent 100%);
 background:linear-gradient(to top,var(--bg1) 0%,color-mix(in srgb,var(--bg1) 85%,transparent) 30%,transparent 100%)}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 6px + var(--kb,0px));z-index:30;display:flex;align-items:center;gap:4px;padding:7px;border-radius:999px;max-width:calc(100% - 20px)}
.dock:empty{display:none}
.ib{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:0;background:transparent;color:var(--ink);cursor:pointer;flex:none;padding:0;transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .2s}
.ib:hover{background:var(--solid)}
.ib:active{transform:scale(.92)}
.ib.sm{width:32px;height:32px;color:var(--sub)}
.ib.dng{color:var(--danger)}
.ib.pri{background:linear-gradient(160deg,var(--acc2),var(--acc));color:var(--accink);box-shadow:0 6px 16px rgba(31,59,102,.32),inset 0 1.5px 1px rgba(255,255,255,.45),inset 0 -2px 3px rgba(0,0,0,.16)}
.dk{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;border:0;background:transparent;font:inherit;font-weight:600;font-size:.92rem;color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .2s}
.dk.pri{color:var(--accink);padding:0 20px 0 16px;background:linear-gradient(160deg,var(--acc2),var(--acc));box-shadow:0 8px 18px rgba(31,59,102,.38),inset 0 1.5px 1px rgba(255,255,255,.45),inset 0 -2px 3px rgba(0,0,0,.16)}
.dk.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 30%,transparent)}
/* 按下時像液態玻璃一樣膨脹發亮 */
.dock .ib:active,.dock .dk:active{transform:scale(1.14);background-color:rgba(255,255,255,.26)}
.dock .dk.pri:active{background-color:transparent;filter:brightness(1.12)}
.dock.syncing [data-dk="cfg"]::after,.dock.err [data-dk="cfg"]::after{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.dock.syncing [data-dk="cfg"]::after{animation:pulse 1s ease-in-out infinite}
.dock.err [data-dk="cfg"]::after{background:var(--danger)}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;top:0;left:0;right:0;bottom:calc(-1*var(--gap));width:100%}
main{position:fixed;top:0;left:0;right:0;bottom:calc(-1*var(--gap));overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
 padding:calc(env(safe-area-inset-top,0px) + 22px) max(14px,calc((100% - 1080px)/2)) calc(124px + env(safe-area-inset-bottom,0px))}
main>*{animation:rise .35s ease both}
main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main>*{animation:none}.ib,.dk{transition:none}}

/* buttons / fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:500;font-size:.95rem;color:var(--ink);cursor:pointer;padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:var(--solid);box-shadow:inset 0 1px 1px var(--spec),inset 0 -1px 1px var(--spec2)}
.btn:active,.chip:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(160deg,var(--acc2),var(--acc));color:var(--accink);border-color:transparent;box-shadow:0 8px 18px rgba(31,59,102,.32),inset 0 1.5px 1px rgba(255,255,255,.45),inset 0 -2px 3px rgba(0,0,0,.16)}
.btn.dng{color:var(--danger)}
.btn.pri.dng{background:linear-gradient(160deg,#ee7a62,#c0462f);color:#fff;box-shadow:0 8px 18px rgba(192,70,47,.35),inset 0 1.5px 1px rgba(255,255,255,.4)}
.chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.88rem;color:var(--ink);cursor:pointer;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--solid);box-shadow:inset 0 1px 1px var(--spec2)}
.chip.on{background:var(--acc);color:var(--accink);border-color:transparent}
.chip.add{color:var(--sub);border-style:dashed}
.chip.warn{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.chipin{font:inherit;font-size:16px;width:130px;color:var(--ink);background:var(--solid);border:1px solid var(--acc);border-radius:999px;padding:6px 14px;outline:none}
label{display:block;font-size:.78rem;font-weight:500;color:var(--sub);margin:14px 0 5px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:11px 14px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
input::placeholder{color:var(--sub);opacity:.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;padding:4px;gap:2px;border-radius:999px;background:var(--solid);border:1px solid var(--line);margin-top:14px}
.seg button{flex:1;font:inherit;font-weight:600;font-size:.9rem;color:var(--sub);background:transparent;border:0;border-radius:999px;padding:10px 0;cursor:pointer;transition:all .3s cubic-bezier(.34,1.3,.64,1)}
.seg button.on{color:var(--accink);background:linear-gradient(160deg,var(--acc2),var(--acc));box-shadow:0 4px 12px rgba(31,59,102,.3),inset 0 1.5px 1px rgba(255,255,255,.4)}

/* panes */
.pane{border-radius:28px;padding:20px}
.pane+.pane{margin-top:16px}
h2{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:.01em}
h3{margin:0;font-size:1.05rem;font-weight:700}
.sub{color:var(--sub);font-size:.9rem;margin:3px 0 0}
.msg{margin:12px 0 0;color:var(--sub);font-size:.88rem}
.msg.c{text-align:center}
.msg.warn{color:var(--danger)}

/* shelf */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{border-radius:24px;padding:14px 16px}
.stat .n{white-space:nowrap;font-size:1.65rem;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.stat .n small{font-size:.8rem;font-weight:500;color:var(--sub);margin-right:3px}
.stat .l{font-size:.78rem;color:var(--sub);margin-top:3px}
.tools{display:flex;gap:10px;margin-bottom:16px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:8px;border-radius:999px;padding:0 16px;height:48px;color:var(--sub)}
.search input{border:0;background:transparent;padding:0;height:100%;box-shadow:none!important;border-radius:0}
.search .ib.pri{width:36px;height:36px;margin-right:-8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:20px 14px}
@media(min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:26px 18px}}
.card{cursor:pointer;min-width:0;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.card:hover{transform:translateY(-4px)}
.card:active{transform:scale(.97)}
.card .cv{margin:10px 10px 0 0}
.card .t{margin-top:10px;font-size:.88rem;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{margin-top:2px;font-size:.76rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--sub);padding:56px 24px;border-radius:30px;line-height:1.9}
.empty .ic{margin:0 auto 14px;color:var(--acc)}

/* cover: 圖片直接填滿外框 */
.cv{position:relative;isolation:isolate}
.cover{position:relative;width:100%;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:linear-gradient(150deg,#9db0cc,#62799c);box-shadow:0 8px 18px rgba(15,30,65,.28),0 1px 3px rgba(15,30,65,.2);display:flex;align-items:flex-end}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.26) 0,rgba(255,255,255,0) 6%,rgba(0,0,0,0) 88%,rgba(0,0,0,.12) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.cover .ph{position:relative;z-index:1;padding:12px;color:#fff;font-weight:700;font-size:.9rem;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.cv.stack::before,.cv.stack::after{content:"";position:absolute;inset:0;border-radius:10px;background:var(--stk);z-index:-1;box-shadow:0 2px 6px rgba(15,30,65,.14)}
.cv.stack::before{transform:translate(6px,-6px);opacity:.7}
.cv.stack::after{transform:translate(12px,-12px);opacity:.38}
.badge{position:absolute;right:8px;bottom:8px;z-index:2;min-width:24px;text-align:center;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:700;color:#fff;background:rgba(0,0,0,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25)}

/* series（無橫幅：直接把書名排在內容裡）*/
.shead{display:flex;gap:16px;align-items:center;margin:2px 2px 4px}
.shead .cv{width:84px;flex:none}
.shead .info{min-width:0;flex:1}
.shead h2{overflow-wrap:anywhere;font-size:1.4rem}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{font-size:.78rem;font-weight:500;padding:4px 11px;border-radius:999px;background:var(--solid);border:1px solid var(--line)}
.sec{margin-top:26px}
.sech{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sech .cnt{flex:1;font-size:.8rem;color:var(--sub)}
.miss{margin:20px 4px -4px;font-size:.82rem;color:var(--sub)}
.sec.compact{margin-top:16px;padding:12px 14px 4px;border-radius:24px;background:var(--solid);border:1px solid var(--line)}
.sec.compact .sech{cursor:pointer;margin-bottom:6px}
.chev{display:grid;color:var(--sub);transition:transform .2s}.chev.up{transform:rotate(180deg)}
.strip{cursor:pointer;display:flex;overflow-x:auto;padding:8px 6px 16px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.mini{position:relative;flex:none;width:60px;margin-left:-24px;cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.mini:first-child{margin-left:0}.mini:hover{transform:translateY(-5px)}
.mini .cover{border-radius:7px;box-shadow:5px 0 12px rgba(10,20,45,.3)}
.sec.compact .grid{padding:6px 0 14px}

/* 對話框 */
.dlg{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px}
.dlg-b{position:absolute;inset:0;background:rgba(6,14,30,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .2s ease both}
.dlg-p{position:relative;width:min(100%,340px);border-radius:32px;padding:26px 22px 20px;text-align:center;background:var(--pop);animation:pop .3s cubic-bezier(.2,.9,.3,1.15) both}
.dlg-t{font-size:1.1rem;font-weight:700}
.dlg-m{margin-top:8px;font-size:.92rem;color:var(--sub);line-height:1.6}
.dlg-i{margin-top:16px;text-align:center}
.dlg-a{display:flex;gap:10px;margin-top:22px}.dlg-a .btn{flex:1;padding:12px 10px}.dlg-a.col{flex-direction:column}
.dlg.out{animation:fadeout .17s ease forwards}
@keyframes fade{from{opacity:0}}@keyframes fadeout{to{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.9) translateY(8px)}}

/* edit */
.editgrid{display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:start}
.editgrid .cvcol .cv{margin:0}
@media(max-width:600px){.editgrid{grid-template-columns:1fr}.cvcol{width:150px;margin:0 auto}}
.irow{display:flex;gap:8px;align-items:center}
.ib.busy svg{animation:rot .8s linear infinite}

/* scan */
.scan{position:relative;border-radius:30px;overflow:hidden;background:#000;aspect-ratio:4/3;box-shadow:var(--shadow)}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reticle{position:absolute;left:9%;right:9%;top:26%;bottom:26%;border-radius:18px;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 999px rgba(0,0,0,.38);transition:border-color .2s,box-shadow .2s}
.reticle::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:rgba(255,90,70,.9);box-shadow:0 0 10px rgba(255,60,40,.9)}
.scan.ok .reticle{border-color:#5be38a;box-shadow:0 0 0 999px rgba(20,90,50,.35),0 0 24px rgba(91,227,138,.7)}
.scan.dup .reticle{border-color:#ffc857;box-shadow:0 0 0 999px rgba(110,80,10,.35)}
.qh{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;font-weight:600;font-size:.92rem}
.qi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:var(--solid);border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.qc{width:36px;flex:none}
.qc .cover{border-radius:5px;box-shadow:0 3px 8px rgba(15,30,65,.25)}
.qc .ph{font-size:.5rem;padding:4px}
.qm{flex:1;min-width:0}
.qt{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qs{font-size:.78rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qs.bad{color:var(--danger)}
.qd{display:grid;place-items:center;color:var(--acc);width:24px}
.spin{display:block;width:16px;height:16px;border-radius:50%;border:2px solid color-mix(in srgb,var(--acc) 25%,transparent);border-top-color:var(--acc);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 82px + var(--kb,0px));transform:translateX(-50%);z-index:40;padding:10px 20px;border-radius:999px;font-size:.9rem;font-weight:500;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;animation:rise .25s ease both}
</style>
</head>
<body>
<main id="app"></main>
<div class="edge"></div>
<nav class="dock glass" id="dock"></nav>
<script>
// ===== 設定 =====
// 書籍資料查詢代理。留空即可：在「設定」頁填入 Worker 網址後，會自動拿它來查詢 ISBN。
const PROXY = "https://isbn-lookup.yus1ferwang.workers.dev/?code="; // 例："https://isbn-lookup.你的帳號.workers.dev/?code="
const ZX_URL="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";

// ===== 圖示 =====
const I={
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 back:'<path d="m15 18-6-6 6-6"/>',
 sliders:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
 scan:'<path d="M3 8V6a3 3 0 0 1 3-3h2M16 3h2a3 3 0 0 1 3 3v2M21 16v2a3 3 0 0 1-3 3h-2M8 21H6a3 3 0 0 1-3-3v-2M8 8v8M12 8v8M16 8v8"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>',
 check:'<path d="m5 12 5 5 9-9"/>',
 pencil:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
 download:'<path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/>',

 book:'<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M8 7h8"/>',

function split(t){t=(t||"").trim();const m=t.match(/^(.*?)[\s　]*[（(]?\s*(?:第|vol\.?|VOL\.?|Vol\.?)?\s*(\d+)\s*(?:集|卷|冊|巻|話)?\s*[）)]?\s*$/);return m&&m[1].trim()?{base:m[1].trim(),vol:+m[2]}:{base:t,vol:null}}
// 移除書名裡的「（電子書）」「[電子書]」等標註，避免影響系列與集數判斷
const clean=s=>String(s||"").replace(/[\s　]*[（(\[【]\s*電子書\s*[）)\]】]/g,"").replace(/\s{2,}/g," ").trim();
const skeyS=s=>(s||"").trim().toLowerCase();
const skey=b=>skeyS(b.series||b.title);
const catsOf=name=>[...new Set(books.filter(x=>skey(x)===skeyS(name)).map(x=>x.cat).filter(Boolean))];
// 由書名推測系列／集數／分類：已有系列名稱（取最長的前綴）優先，其次才從書名尾端的數字切出
function guessFromTitle(title){
 const t=clean(title),nt=norm(t);
 const names=[...new Set(books.map(b=>(b.series||"").trim()).filter(Boolean))];
 let best=null;
 for(const n of names){const nn=norm(n);if(nn.length>=2&&nt.startsWith(nn)&&(!best||nn.length>norm(best).length))best=n}
 const sp=split(t);let series,vol;
 if(best){series=best;const m=nt.slice(norm(best).length).match(/(\d+)/);vol=m?+m[1]:sp.vol}
 else{series=sp.base;vol=sp.vol}
 let cat="";
 for(const c of catsOf(series)){if(nt.includes(norm(c))){cat=c;break}}
 return{series,vol,cat};
}
function groups(){const g={};books.forEach(b=>{(g[skey(b)||b.id]??=[]).push(b)});
 return Object.entries(g).map(([k,l])=>{l.sort((a,b)=>(a.vol??1e9)-(b.vol??1e9)||a.date-b.date);return{k,l,first:l[0],last:Math.max(...l.map(x=>x.date||0))}})}
function gaps(l){const v=[...new Set(l.map(b=>b.vol).filter(n=>Number.isInteger(n)&&n>0))].sort((a,b)=>a-b);
 if(v.length<2)return[];const out=[];for(let i=v[0];i<v[v.length-1];i++)if(!v.includes(i))out.push(i);return out.length>12?[...out.slice(0,12),"…"]:out}
(function(){let ch=false;
 for(const b of books){const t=clean(b.title),s=clean(b.series);if(t===b.title&&s===(b.series||""))continue;
  const sp=split(t);b.title=t;b.series=s?split(s).base:sp.base;if(b.vol==null)b.vol=sp.vol;b.updatedAt=Date.now();ch=true}
 if(ch)persist()})();
function isbnOK(s){s=s.replace(/[-\s]/g,"");if(!/^97[89]\d{10}$/.test(s))return false;let n=0;for(let i=0;i<12;i++)n+=+s[i]*(i%2?3:1);return (10-n%10)%10==+s[12]}
const cover=b=>`<div class="cover">${b.cover?`<img src="${esc(b.cover)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:`<div class="ph">${esc(b.pending?"ISBN "+b.isbn:(b.title||"無封面"))}</div>`}</div>`;
function toast(m){const t=document.createElement("div");t.className="toast glass";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1900)}
const setTitle=t=>{document.title=t==="我的書櫃"?t:t+"．我的書櫃"};

function dlg(o){return new Promise(res=>{
 const w=document.createElement("div");w.className="dlg";
 const acts=o.actions||[...(o.cancel===false?[]:[{label:o.cancel||"取消",v:null}]),{label:o.ok||"確定",v:true,cls:"pri"+(o.danger?" dng":"")}];

 document.addEventListener("keydown",key);
 w.querySelector(".dlg-b").onclick=()=>fin(null);

function parentOf(){const h=location.hash;
 if(h.startsWith("#/book/")){const b=books.find(x=>x.id===h.slice(7));if(b&&books.filter(x=>skey(x)===skey(b)).length>1)return"#/series/"+encodeURIComponent(skey(b));return"#/"}

function stopScan(){clearTimeout(timer);timer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function route(){
 stopScan();scanDockFn=null;
 const raw=location.hash||"#/",h=raw.slice(1)||"/",p=h.split("/");
 trackHash(raw==="#"?"#/":raw);
 if(h!==lastHash){app.scrollTop=0;lastHash=h}
 if(h==="/")return shelf();
 if(p[1]==="series")return series(decodeURIComponent(p[2]));
 if(p[1]==="book")return edit(books.find(b=>b.id===p[2]),false);

function renderGrid(){
 let g=groups();const q=norm(query);
 if(q)g=g.filter(x=>x.l.some(b=>norm([b.title,b.series,b.author,b.isbn].join(" ")).includes(q)));
 const nm=x=>x.first.series||x.first.title;
 if(sortMode==="title")g.sort((a,b)=>nm(a).localeCompare(nm(b),"zh-Hant"));
 else if(sortMode==="author")g.sort((a,b)=>(a.first.author||"~").localeCompare(b.first.author||"~","zh-Hant")||nm(a).localeCompare(nm(b),"zh-Hant"));

const openCats=new Set();
function series(k){
 const g=groups().find(x=>x.k===k);if(!g){go("#/",true);return}
 setTitle("系列");const f=g.first;
 const minD=c=>Math.min(...g.l.filter(b=>(b.cat||"")===c).map(b=>b.date||0));
 const cats=[...new Set(g.l.map(b=>b.cat||""))].sort((a,b)=>a===""?-1:b===""?1:minD(a)-minD(b));
 const many=cats.length>1;
 setDock([backBtn(),{id:"rn",icon:"pencil",tip:"重新命名系列",fn:()=>renameSeries(k)},scanBtn()]);
 const full=b=>`<div class="card" data-go="#/book/${b.id}"><div class="cv">${cover(b)}</div><div class="t">${b.vol!=null?"第 "+b.vol+" 集":esc(b.title)}</div></div>`;
 const sec=(c)=>{
  const l=g.l.filter(b=>(b.cat||"")===c),miss=gaps(l);
  const meta=`${l.length} 本${miss.length?` · 缺第 ${miss.join("、")} 集`:""}`;
  const rn=c?`<button class="ib sm" data-rncat="${esc(c)}" data-sk="${esc(k)}" aria-label="重新命名分類">${ic("pencil",16)}</button>`:"";
  if(!many)return`<section class="sec">${miss.length?`<p class="miss">缺第 ${miss.join("、")} 集</p>`:""}<div class="grid">${l.map(full).join("")}</div></section>`;
  const key=k+"|"+c,open=openCats.has(key);
  return`<section class="sec compact"><div class="sech" data-tog="${esc(key)}"><h3>${esc(c||"本篇")}</h3><span class="cnt">${meta}</span>${rn}<span class="chev${open?" up":""}">${ic("chev",18)}</span></div>`+
   (open?`<div class="grid">${l.map(full).join("")}</div>`
        :`<div class="strip" data-tog="${esc(key)}">${l.map((b,j)=>`<div class="mini" style="z-index:${l.length-j}" title="${esc(b.vol!=null?"第 "+b.vol+" 集":b.title)}">${cover(b)}</div>`).join("")}</div>`)+`</section>`;
 };
 app.innerHTML=`<div class="shead"><div class="cv">${cover(f)}</div><div class="info"><h2>${esc(f.series||f.title)}</h2><p class="sub">${esc(f.author||"作者未填")}</p>
  <div class="pills"><span class="pill">${g.l.length} 本</span>${many?`<span class="pill">${cats.length} 個分類</span>`:""}</div></div></div>`+cats.map(sec).join("");
}
function goSeries(name){const nh="#/series/"+encodeURIComponent(skeyS(name));if(location.hash===nh)route();else location.hash=nh}
async function renameSeries(k){

 const old=l[0].series||l[0].title,nn=await dlg({title:"重新命名系列",input:old,placeholder:"系列名稱"});if(nn==null)return;

}

  {id:"manual",icon:"pencil",tip:"手動建檔",fn:()=>{draft=blank();go("#/edit/new")}},

 const noCam=m=>{$("#sm").textContent=m;$("#sc").hidden=true};

 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false}).then(async s=>{
  stream=s;const v=$("#v");if(!v){stopScan();return}
  v.setAttribute("playsinline","");v.muted=true;v.srcObject=s;try{await v.play()}catch(e){}
  const detect=await makeDetector();

 }).catch(()=>noCam("無法開啟鏡頭：請允許網站使用相機（iPhone：設定 → Safari → 相機），或改用手動輸入。"));

const loadScript=u=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function makeDetector(){
 if("BarcodeDetector" in window){
  try{const d=new BarcodeDetector({formats:["ean_13"]});return async v=>{const r=await d.detect(v);return r[0]&&r[0].rawValue}}catch(e){}
 }
 try{
  if(!window.ZXing)await loadScript(ZX_URL);
  const Z=window.ZXing,h=new Map();
  h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13]);h.set(Z.DecodeHintType.TRY_HARDER,true);
  const rd=new Z.MultiFormatReader();rd.setHints(h);
  const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
  return async v=>{
   if(!v.videoWidth)return null;
   const w=Math.min(960,v.videoWidth),k=w/v.videoWidth;cv.width=w;cv.height=Math.round(v.videoHeight*k);
   cx.drawImage(v,0,0,cv.width,cv.height);
   try{return rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))).getText()}catch(e){return null}
  };
 }catch(e){return null}
}

// 快速入庫：掃到就先存成「待補資料」，資料在背景（最多同時 3 本）查完再補上，鏡頭不中斷
function quickAdd(isbn){
 const ex=books.find(x=>sameIsbn(x.isbn,isbn));
 if(ex){flash("dup");toast("已收藏："+(ex.series||ex.title)+(ex.vol!=null?" 第 "+ex.vol+" 集":""));return}
 const b=blank();b.isbn=isbn;b.title="ISBN "+isbn;b.pending=true;
 books.push(b);sess.push(b.id);save();
 flash("ok");beep();try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
 renderQ();scanDockFn&&scanDockFn();enqueueFill(b.id);
}
const fq=[];let frun=0;
function enqueueFill(id){if(!fq.includes(id))fq.push(id);pumpFill()}
function pumpFill(){
 while(frun<3&&fq.length){const id=fq.shift();frun++;fillOne(id).catch(()=>{}).finally(()=>{frun--;pumpFill()})}
 if(frun===0&&!fq.length){const h=location.hash;if(h===""||h==="#/")shelf()}
}
async function fillOne(id){
 let b=books.find(x=>x.id===id);if(!b||!b.pending)return;
 if(offline()){renderQ();return}
 const r=await lookup(b.isbn,{quiet:true});if(r&&r.title)r.title=clean(r.title);
 b=books.find(x=>x.id===id);if(!b)return;
 if(!r){failed.add(id);renderQ();return}
 const gs=guessFromTitle(r.title||"");
 Object.assign(b,{title:r.title||b.title,author:r.author||"",price:r.price||"",series:gs.series||r.title||"",vol:gs.vol,cat:gs.cat,pending:false,updatedAt:Date.now()});
 if(r.cover){b.cover=r.cover;b.coverAt=Date.now();b._up=true}
 if(!b.author){const m=books.find(x=>x.id!==id&&skey(x)===skey(b)&&x.author);if(m)b.author=m.author}
 failed.delete(id);save();renderQ();
}
function fillPending(force){
 if(offline())return 0;if(force)failed.clear();
 let n=0;books.forEach(b=>{if(b.pending&&b.isbn&&!failed.has(b.id)){enqueueFill(b.id);n++}});return n;
}

const tmo=(u,o={},ms=6000)=>{const c=new AbortController();setTimeout(()=>c.abort(),ms);return fetch(u,{...o,signal:c.signal})};
const imgOK=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i.naturalWidth>40);i.onerror=()=>r(false);i.src=u});
const lookupBase=()=>PROXY||(cfg.url?cfg.url.replace(/\/+$/,"")+"/?code=":"");
const SRC=[
 ["自訂代理",async i=>{const b=lookupBase();if(!b)return null;return await (await tmo(b+i,{},15000)).json()}],
 ["Google Books",async i=>{
  const j=await (await tmo("https://www.googleapis.com/books/v1/volumes?q=isbn:"+i)).json();const it=j.items&&j.items[0];if(!it)return null;
  const v=it.volumeInfo,p=it.saleInfo&&it.saleInfo.listPrice;
  const im=v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail);
  return{title:v.title+(v.subtitle?" "+v.subtitle:""),author:(v.authors||[]).join("、"),price:p?p.currencyCode+" "+p.amount:"",cover:im?im.replace("http:","https:").replace("&edge=curl",""):""}}],
 ["Open Library",async i=>{
  const j=await (await tmo("https://openlibrary.org/api/books?format=json&jscmd=data&bibkeys=ISBN:"+i)).json();const v=j["ISBN:"+i];
  const c="https://covers.openlibrary.org/b/isbn/"+i+"-L.jpg?default=false";
  const hasC=await imgOK(c);
  if(!v&&!hasC)return null;
  return{title:v?v.title:"",author:v?(v.authors||[]).map(a=>a.name).join("、"):"",cover:hasC?c:""}}],
 ["NDL（日本國會圖書館）",async i=>{
  const x=new DOMParser().parseFromString(await (await tmo("https://ndlsearch.ndl.go.jp/api/opensearch?isbn="+i)).text(),"text/xml");
  const it=x.querySelector("item");const t=it&&it.getElementsByTagName("dc:title")[0];
  const c="https://ndlsearch.ndl.go.jp/thumbnail/"+i+".jpg";const hasC=await imgOK(c);
  if(!t&&!hasC)return null;
  const a=it&&it.getElementsByTagName("dc:creator")[0];
  return{title:t?t.textContent.trim():"",author:a?a.textContent.trim():"",cover:hasC?c:""}}]

async function lookup(isbn,o={}){
 if(offline())return null;
 const out={title:"",author:"",price:"",cover:""},used=[];
 for(const [name,fn] of SRC){
  if(out.title&&out.cover&&out.author)break;
  if(!o.quiet){const sm=$("#sm");if(sm)sm.textContent="查詢中："+name+"…"}
  try{const r=await fn(isbn);if(!r)continue;let hit=false;
   for(const k in out)if(!out[k]&&r[k]){out[k]=r[k];hit=true}
   if(hit)used.push(name)}catch(e){}
 }
 if(!out.title&&!out.cover)return null;
 out._src=used.join(" + ");return out;
}

 if(r){Object.assign(draft,{title:r.title||"",author:r.author||"",price:r.price||"",cover:r.cover||"",_src:r._src});
  const gs=guessFromTitle(draft.title);draft.series=gs.series;draft.vol=gs.vol;draft.cat=gs.cat;
  if(!draft.author){const m=books.find(x=>skey(x)===skeyS(gs.series)&&x.author);if(m)draft.author=m.author}}
 draft._miss=!r;draft._off=offline();go("#/edit/new");
}

// ===== 跨裝置同步（Cloudflare Worker + KV）=====
let syncing=false,again=false,syncTimer=null;
const isData=s=>typeof s==="string"&&s.startsWith("data:");
const pub=b=>{const o={...b};delete o._up;if(isData(o.cover))delete o.cover;return o};
const setSync=st=>{const el=$("#dock");if(!el)return;el.classList.toggle("syncing",st==="busy");el.classList.toggle("err",st==="err")};
function schedSync(){if(!cfg.url||!cfg.token)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(),1500)}
async function api(path,opt={}){
 const r=await fetch(cfg.url.replace(/\/+$/,"")+path,{...opt,headers:{authorization:"Bearer "+cfg.token,"content-type":"application/json"}});
 if(r.status===401)throw new Error("同步密碼不正確");
 if(r.status===501)throw new Error("Worker 尚未設定 KV 或 SYNC_TOKEN");
 if(!r.ok&&r.status!==404)throw new Error("伺服器錯誤（"+r.status+"）");
 return r;
}
async function sync(){
 if(!cfg.url||!cfg.token||offline())return;
 if(syncing){again=true;return}
 syncing=true;setSync("busy");const r0=rev;let failedSync=false;
 try{
  const r=await api("/sync",{method:"POST",body:JSON.stringify({books:[...books.map(pub),...tombs]})});
  const merged=(await r.json()).books||[];
  const loc=new Map(books.map(b=>[b.id,b])),hc=new Map(),nb=[],nt=[];
  for(const m of merged){
   if(m.deleted){nt.push({id:m.id,deleted:true,updatedAt:m.updatedAt});continue}
   const l=loc.get(m.id);hc.set(m.id,!!m.hasCover);
   const rec={...m};delete rec.hasCover;
   if(!rec.cover||isData(rec.cover))rec.cover=(l&&l.cover)||"";
   rec._up=!!(l&&l._up&&l.coverAt===m.coverAt);
   nb.push(rec);
  }
  for(const b of nb)if(b._up&&isData(b.cover)){
   const u=await api("/cover/"+b.id,{method:"PUT",body:JSON.stringify({cover:b.cover})});
   if(u.ok){b._up=false;hc.set(b.id,true)}
  }
  const need=nb.filter(b=>{const l=loc.get(b.id);return hc.get(b.id)&&!b._up&&!(l&&isData(l.cover)&&l.coverAt===b.coverAt)});
  for(let i=0;i<need.length;i+=3)await Promise.all(need.slice(i,i+3).map(async b=>{
   const c=await api("/cover/"+b.id);if(c.ok){const j=await c.json();if(j.cover)b.cover=j.cover}
  }));
  if(rev!==r0){again=true;return}
  books=nb;tombs=nt;persist();
  cfg.last=Date.now();cfg.err="";saveCfg();
  const h=location.hash;if(h===""||h==="#/"||h.startsWith("#/series"))route();
 }catch(e){
  // 網路中斷（離線、逾時）不算錯誤，等恢復連線後會自動再同步
  if(!(e instanceof TypeError)&&e.name!=="AbortError"){failedSync=true;cfg.err=String(e.message||e);saveCfg()}
 }
 finally{syncing=false;setSync(failedSync?"err":"ok");if(again){again=false;setTimeout(sync,300)}}
}
function statusText(){
 if(!cfg.url||!cfg.token)return "尚未啟用同步。";
 if(offline())return "目前離線，連線後會自動同步。";
 return cfg.err?"上次同步失敗："+cfg.err:cfg.last?"連線正常，上次同步："+new Date(cfg.last).toLocaleString("zh-TW"):"尚未同步。";
}

 $("#x_in").onclick=()=>$("#x_f").click();
 $("#x_f").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
   const d=JSON.parse(await f.text());if(!Array.isArray(d.books))throw 0;
   const ids=new Map(books.map(b=>[b.id,b]));let n=0;
   for(const b of d.books){if(!b||!b.id)continue;const o=ids.get(b.id);
    if(!o||(b.updatedAt||b.date||0)>(o.updatedAt||0)){
     if(o)books=books.filter(x=>x.id!==b.id);
     tombs=tombs.filter(t=>t.id!==b.id);
     b.updatedAt??=b.date||Date.now();if(isData(b.cover)){b.coverAt??=b.updatedAt;b._up=true}
     books.push(b);n++}}
   save();await dlg({title:"已還原",msg:"加入了 "+n+" 本書。",cancel:false,ok:"好"});
  }catch(err){await dlg({title:"無法還原",msg:"這不是有效的備份檔。",cancel:false,ok:"好"})}
  e.target.value="";
 };
}

// ===== 初始化 =====
document.addEventListener("click",e=>{
 const dk=e.target.closest("[data-dk]");if(dk){const f=dockActs[dk.dataset.dk];f&&f();return}
 const th=e.target.closest("[data-th]");if(th){setTheme(th.dataset.th);document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b===th));return}
 if(e.target.closest("[data-undo]"))return undoLast();
 const rs=e.target.closest("[data-rnseries]");if(rs)return renameSeries(rs.dataset.rnseries);
 const rc=e.target.closest("[data-rncat]");if(rc)return renameCat(rc.dataset.sk,rc.dataset.rncat);
 const tg=e.target.closest("[data-tog]");if(tg){const k=tg.dataset.tog;openCats.has(k)?openCats.delete(k):openCats.add(k);return route()}
 const c=e.target.closest("[data-go]");if(c)go(c.dataset.go);
});
// 虛擬鍵盤出現時，讓底部懸浮列浮在鍵盤上方
if(window.visualViewport){const upd=()=>{const vv=visualViewport,ae=document.activeElement,typing=ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName);const d=innerHeight-vv.height-vv.offsetTop;document.documentElement.style.setProperty("--kb",(typing&&d>150?d:0)+"px")};visualViewport.addEventListener("resize",upd);visualViewport.addEventListener("scroll",upd);addEventListener("focusout",()=>setTimeout(upd,50))}
matchMedia("(prefers-color-scheme: dark)").addEventListener&&matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(themeMode()==="auto")applyTheme()});
addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync()});
addEventListener("online",()=>{failed.clear();sync();fillPending();renderQ()});
addEventListener("offline",()=>renderQ());
addEventListener("hashchange",route);
// 清除先前版本留下的離線快取與 Service Worker
if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>{rs.forEach(r=>r.unregister());if(rs.length&&window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)))}).catch(()=>{})}
applyTheme();route();sync();setTimeout(fillPending,1500);
</script>
</body>
</html>
