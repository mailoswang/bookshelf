<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="書櫃">
<meta name="theme-color" content="#f4ede2">
<title>我的書櫃</title>
<script>(function(){var t=null;try{t=localStorage.getItem("bookshelf.theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
 --ink:#2f2a25;--sub:#8b8174;--bg1:#f5eee3;--bg2:#dfe7d6;--bg3:#f1dccd;
 --glass:linear-gradient(145deg,rgba(255,255,255,.68),rgba(255,255,255,.36));
 --solid:rgba(255,255,255,.55);--edge:rgba(255,255,255,.78);--line:rgba(70,50,30,.12);--hi:rgba(255,255,255,.7);
 --acc:#b0653f;--acc2:#cf8a5d;--accink:#fff;--danger:#c0462f;--stk:#d8cbb6;
 --shadow:0 10px 30px rgba(90,65,40,.12),0 1px 2px rgba(90,65,40,.08);
 color-scheme:light;
}
:root[data-theme="dark"]{
 --ink:#f1e9dc;--sub:#a99b88;--bg1:#1a1714;--bg2:#1b2520;--bg3:#2c201a;
 --glass:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.05));
 --solid:rgba(255,255,255,.09);--edge:rgba(255,255,255,.18);--line:rgba(255,255,255,.12);--hi:rgba(255,255,255,.14);
 --acc:#e0a173;--acc2:#eab48b;--accink:#2a1d14;--danger:#ff8a73;--stk:#4a4036;
 --shadow:0 12px 36px rgba(0,0,0,.45);
 color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;color:var(--ink);background:var(--bg1);line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:radial-gradient(46vmax 46vmax at 8% 4%,var(--bg2),transparent 70%),radial-gradient(50vmax 50vmax at 98% 28%,var(--bg3),transparent 70%),radial-gradient(40vmax 40vmax at 25% 102%,var(--bg2),transparent 70%)}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
.ic{display:block;flex:none}

/* header */
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:10;margin:10px auto 16px;width:calc(100% - 24px);max-width:1080px;height:54px;border-radius:999px;display:flex;align-items:center;gap:2px;padding:7px 8px 7px 8px}
.ttl{flex:1;min-width:0;font-weight:700;font-size:1.02rem;padding:0 10px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:0;background:transparent;color:var(--ink);cursor:pointer;flex:none;padding:0}
.ib:hover{background:var(--solid)}
.ib.sm{width:32px;height:32px;color:var(--sub)}
.ib.pri{background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--accink);box-shadow:0 6px 16px rgba(176,101,63,.32)}
.ib.syncing::after,.ib.err::after{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.ib.syncing::after{animation:pulse 1s ease-in-out infinite}
.ib.err::after{background:var(--danger)}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
main{max-width:1080px;margin:0 auto;padding:0 14px calc(120px + env(safe-area-inset-bottom,0px))}
main>*{animation:rise .35s ease both}
main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main>*{animation:none}}

/* buttons / fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:500;font-size:.95rem;color:var(--ink);cursor:pointer;padding:11px 18px;border-radius:999px;border:1px solid var(--edge);background:var(--solid);box-shadow:inset 0 1px 0 var(--hi)}
.btn:active,.ib:active,.chip:active,.fab:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--accink);border-color:transparent;box-shadow:0 8px 18px rgba(176,101,63,.32)}
.btn.dng{color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.88rem;color:var(--ink);cursor:pointer;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--solid)}
.chip.on{background:var(--acc);color:var(--accink);border-color:transparent}
.chip.add{color:var(--sub);border-style:dashed}
.chipin{font:inherit;font-size:16px;width:130px;color:var(--ink);background:var(--solid);border:1px solid var(--acc);border-radius:999px;padding:6px 14px;outline:none}
label{display:block;font-size:.78rem;font-weight:500;color:var(--sub);margin:14px 0 5px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:11px 14px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
input::placeholder{color:var(--sub);opacity:.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* panes */
.pane{border-radius:26px;padding:20px}
h2{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:.01em}
h3{margin:0;font-size:1.05rem;font-weight:700}
.sub{color:var(--sub);font-size:.9rem;margin:3px 0 0}
.msg{margin:12px 0 0;color:var(--sub);font-size:.88rem}
.msg.warn{color:var(--danger)}

/* shelf */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{border-radius:22px;padding:14px 16px}
.stat .n{font-size:1.65rem;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.stat .n small{font-size:.8rem;font-weight:500;color:var(--sub);margin-right:3px}
.stat .l{font-size:.78rem;color:var(--sub);margin-top:3px}
.tools{display:flex;gap:10px;margin-bottom:20px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:8px;border-radius:999px;padding:0 16px;height:46px;color:var(--sub)}
.search input{border:0;background:transparent;padding:0;height:100%;box-shadow:none!important;border-radius:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:20px 14px}
@media(min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:26px 18px}}
.card{cursor:pointer;min-width:0;transition:transform .2s ease}
.card:hover{transform:translateY(-4px)}
.card:active{transform:scale(.98)}
.card .cv{margin:10px 10px 0 0}
.card .t{margin-top:10px;font-size:.88rem;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{margin-top:2px;font-size:.76rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--sub);padding:56px 24px;border-radius:28px;line-height:1.9}
.empty .ic{margin:0 auto 14px;color:var(--acc)}

/* cover: 圖片直接填滿外框 */
.cv{position:relative;isolation:isolate}
.cover{position:relative;width:100%;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:linear-gradient(150deg,#cdbca4,#a8957b);box-shadow:0 8px 18px rgba(60,40,20,.22),0 1px 3px rgba(60,40,20,.2);display:flex;align-items:flex-end}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.26) 0,rgba(255,255,255,0) 6%,rgba(0,0,0,0) 88%,rgba(0,0,0,.12) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.cover .ph{position:relative;z-index:1;padding:12px;color:#fff;font-weight:700;font-size:.9rem;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.cv.stack::before,.cv.stack::after{content:"";position:absolute;inset:0;border-radius:10px;background:var(--stk);z-index:-1;box-shadow:0 2px 6px rgba(60,40,20,.14)}
.cv.stack::before{transform:translate(6px,-6px);opacity:.7}
.cv.stack::after{transform:translate(12px,-12px);opacity:.38}
.badge{position:absolute;right:8px;bottom:8px;z-index:2;min-width:24px;text-align:center;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:700;color:#fff;background:rgba(0,0,0,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25)}

/* series */
.hero{display:flex;gap:16px;align-items:center;border-radius:26px;padding:18px}
.hero .cv{width:84px;flex:none}
.hero .info{min-width:0;flex:1}
.hero h2{overflow-wrap:anywhere}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{font-size:.78rem;font-weight:500;padding:4px 11px;border-radius:999px;background:var(--solid);border:1px solid var(--line)}
.sec{margin-top:26px}
.sech{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sech .cnt{flex:1;font-size:.8rem;color:var(--sub)}
.miss{margin:20px 4px -4px;font-size:.82rem;color:var(--sub)}

/* edit */
.editgrid{display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:start}
.editgrid .cvcol .cv{margin:0}
@media(max-width:600px){.editgrid{grid-template-columns:1fr}.cvcol{width:150px;margin:0 auto}}

/* scan */
.scan{position:relative;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reticle{position:absolute;left:9%;right:9%;top:26%;bottom:26%;border-radius:16px;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 999px rgba(0,0,0,.38)}
.reticle::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:rgba(255,90,70,.9);box-shadow:0 0 10px rgba(255,60,40,.9)}
.row{display:flex;gap:10px;align-items:center}

/* fab / toast */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;align-items:center;gap:10px;font:inherit;font-weight:700;font-size:1rem;color:var(--accink);cursor:pointer;border:0;padding:0 26px 0 22px;height:56px;border-radius:999px;background:linear-gradient(135deg,var(--acc2),var(--acc));box-shadow:0 14px 30px rgba(176,101,63,.42),inset 0 1px 0 rgba(255,255,255,.35)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;padding:10px 20px;border-radius:999px;font-size:.9rem;font-weight:500;animation:rise .25s ease both}
</style>
</head>
<body>
<header class="bar glass">
 <button class="ib" id="back" hidden aria-label="返回"></button>
 <div class="ttl" id="ttl">我的書櫃</div>
 <button class="ib" id="cfg" aria-label="同步與備份"></button>
 <button class="ib" id="theme" aria-label="切換深淺色"></button>
</header>
<main id="app"></main>
<button class="fab" id="fab" aria-label="掃描入庫"></button>
<script>
// ===== 設定 =====
// 書籍資料查詢代理。留空即可：在「同步與備份」頁填入 Worker 網址後，會自動拿它來查詢 ISBN。
const PROXY = "https://isbn-lookup.yus1ferwang.workers.dev/?code="; // 例："https://isbn-lookup.你的帳號.workers.dev/?code="

// ===== 圖示 =====
const I={
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 back:'<path d="m15 18-6-6 6-6"/>',
 sliders:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
 scan:'<path d="M3 8V6a3 3 0 0 1 3-3h2M16 3h2a3 3 0 0 1 3 3v2M21 16v2a3 3 0 0 1-3 3h-2M8 21H6a3 3 0 0 1-3-3v-2M8 8v8M12 8v8M16 8v8"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>',
 check:'<path d="m5 12 5 5 9-9"/>',
 pencil:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
 download:'<path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/>',
 upload:'<path d="M12 15V3m0 0L8 7m4-4 4 4M4 21h16"/>',
 book:'<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M8 7h8"/>',
 sort:'<path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3"/>',
 next:'<path d="M5 12h14m-6-6 6 6-6 6"/>',
 off:'<path d="M18 6 6 18M6 6l12 12"/>'
};
const ic=(n,s=20)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

// ===== 資料 =====
const KEY="bookshelf.v1",TKEY="bookshelf.tombs",CKEY="bookshelf.sync",SKEY="bookshelf.sort";
let books=[],tombs=[],cfg={};
try{books=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
try{tombs=JSON.parse(localStorage.getItem(TKEY)||"[]")}catch(e){}
try{cfg=JSON.parse(localStorage.getItem(CKEY)||"{}")}catch(e){}
books.forEach(b=>{if(b.updatedAt==null)b.updatedAt=b.date||1;if(b.cover&&b.coverAt==null){b.coverAt=b.date||1;b._up=true}});
let rev=0;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(books));localStorage.setItem(TKEY,JSON.stringify(tombs))}catch(e){}};
const saveCfg=()=>{try{localStorage.setItem(CKEY,JSON.stringify(cfg))}catch(e){}};
const save=()=>{rev++;persist();schedSync()};
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>(s||"").normalize("NFKC").replace(/[\s　]+/g,"").toLowerCase();
let draft=null,stream=null,timer=null,query="",sortMode="recent";
try{sortMode=localStorage.getItem(SKEY)||"recent"}catch(e){}
const SORTS={recent:"最近加入",title:"書名",author:"作者"};

function split(t){t=(t||"").trim();const m=t.match(/^(.*?)[\s　]*[（(]?\s*(?:第|vol\.?|VOL\.?|Vol\.?)?\s*(\d+)\s*(?:集|卷|冊|巻|話)?\s*[）)]?\s*$/);return m&&m[1].trim()?{base:m[1].trim(),vol:+m[2]}:{base:t,vol:null}}
const skeyS=s=>(s||"").trim().toLowerCase();
const skey=b=>skeyS(b.series||b.title);
const catsOf=name=>[...new Set(books.filter(x=>skey(x)===skeyS(name)).map(x=>x.cat).filter(Boolean))];
// 由書名推測系列／集數／分類：已有系列名稱（取最長的前綴）優先，其次才從書名尾端的數字切出
function guessFromTitle(title){
 const t=(title||"").trim(),nt=norm(t);
 const names=[...new Set(books.map(b=>(b.series||"").trim()).filter(Boolean))];
 let best=null;
 for(const n of names){const nn=norm(n);if(nn.length>=2&&nt.startsWith(nn)&&(!best||nn.length>norm(best).length))best=n}
 const sp=split(t);let series,vol;
 if(best){series=best;const m=nt.slice(norm(best).length).match(/(\d+)/);vol=m?+m[1]:sp.vol}
 else{series=sp.base;vol=sp.vol}
 let cat="";
 for(const c of catsOf(series)){if(nt.includes(norm(c))){cat=c;break}}
 return{series,vol,cat};
}
function groups(){const g={};books.forEach(b=>{(g[skey(b)||b.id]??=[]).push(b)});
 return Object.entries(g).map(([k,l])=>{l.sort((a,b)=>(a.vol??1e9)-(b.vol??1e9)||a.date-b.date);return{k,l,first:l[0],last:Math.max(...l.map(x=>x.date||0))}})}
function gaps(l){const v=[...new Set(l.map(b=>b.vol).filter(n=>Number.isInteger(n)&&n>0))].sort((a,b)=>a-b);
 if(v.length<2)return[];const out=[];for(let i=v[0];i<v[v.length-1];i++)if(!v.includes(i))out.push(i);return out.length>12?[...out.slice(0,12),"…"]:out}
function isbnOK(s){s=s.replace(/[-\s]/g,"");if(!/^97[89]\d{10}$/.test(s))return false;let n=0;for(let i=0;i<12;i++)n+=+s[i]*(i%2?3:1);return (10-n%10)%10==+s[12]}
const cover=b=>`<div class="cover">${b.cover?`<img src="${esc(b.cover)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:`<div class="ph">${esc(b.title||"無封面")}</div>`}</div>`;
function toast(m){const t=document.createElement("div");t.className="toast glass";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
const setTitle=t=>{$("#ttl").textContent=t};

// ===== 路由 =====
let lastHash=null;
function stopScan(){clearTimeout(timer);timer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function route(){
 stopScan();const h=location.hash.slice(1)||"/";const p=h.split("/");
 if(h!==lastHash){scrollTo(0,0);lastHash=h}
 $("#back").hidden=h==="/";$("#fab").hidden=h!=="/";
 if(h==="/")return shelf();
 if(p[1]==="series")return series(decodeURIComponent(p[2]));
 if(p[1]==="book")return edit(books.find(b=>b.id===p[2]),false);
 if(p[1]==="edit")return draft?edit(draft,true):(location.hash="#/");
 if(p[1]==="add")return scan();
 if(p[1]==="settings")return settings();
 shelf();
}

// ===== 書架 =====
const card=x=>{const f=x.first,multi=x.l.length>1;
 return`<div class="card" data-go="${multi?"#/series/"+encodeURIComponent(x.k):"#/book/"+f.id}"><div class="cv${multi?" stack":""}">${cover(f)}${multi?`<span class="badge">${x.l.length}</span>`:""}</div><div class="t">${esc(f.series||f.title)}</div><div class="s">${esc(f.author||"")}</div></div>`};
function renderGrid(){
 let g=groups();const q=norm(query);
 if(q)g=g.filter(x=>x.l.some(b=>norm([b.title,b.series,b.author,b.isbn].join(" ")).includes(q)));
 const nm=x=>x.first.series||x.first.title;
 if(sortMode==="title")g.sort((a,b)=>nm(a).localeCompare(nm(b),"zh-Hant"));
 else if(sortMode==="author")g.sort((a,b)=>(a.first.author||"~").localeCompare(b.first.author||"~","zh-Hant")||nm(a).localeCompare(nm(b),"zh-Hant"));
 else g.sort((a,b)=>b.last-a.last);
 $("#grid").innerHTML=g.length?g.map(card).join(""):`<p class="sub" style="grid-column:1/-1;text-align:center;padding:30px 0">找不到符合的書</p>`;
}
function shelf(){
 setTitle("我的書櫃");
 if(!books.length){app.innerHTML=`<div class="empty glass">${ic("book",44)}書架還是空的<br>點擊下方「掃描入庫」，<br>掃描書背的 ISBN 條碼，開始收藏第一本書。</div>`;return}
 const total=books.reduce((s,b)=>{const m=String(b.price||"").match(/^\s*(?:NT\$?|\$)?\s*([\d,]+)\s*$/i);return s+(m?+m[1].replace(/,/g,""):0)},0);
 app.innerHTML=`<div class="stats">
  <div class="stat glass"><div class="n">${groups().length}</div><div class="l">系列</div></div>
  <div class="stat glass"><div class="n">${books.length}</div><div class="l">藏書（本）</div></div>
  ${total?`<div class="stat glass"><div class="n"><small>NT$</small>${total.toLocaleString()}</div><div class="l">總定價</div></div>`:""}
 </div>

 $("#mg").onclick=go;$("#mi").onkeydown=e=>{if(e.key==="Enter")go()};

 const noCam=m=>{$("#sm").textContent=m;$("#sc").hidden=true};
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){noCam("此瀏覽器或連線方式無法使用鏡頭（需 HTTPS），請手動輸入 ISBN。");return}
 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false}).then(async s=>{
  stream=s;const v=$("#v");if(!v){stopScan();return}
  v.setAttribute("playsinline","");v.muted=true;v.srcObject=s;try{await v.play()}catch(e){}
  const detect=await makeDetector();
  if(!detect){$("#sm").textContent="條碼辨識元件載入失敗（可能離線），請手動輸入 ISBN。";return}
  const loop=async()=>{if(!stream)return;try{const t=await detect(v);if(t&&isbnOK(t)){stopScan();return found(t)}}catch(e){}timer=setTimeout(loop,200)};loop();
 }).catch(()=>noCam("無法開啟鏡頭：請允許網站使用相機（iPhone：設定 → Safari → 相機），或改用手動輸入。"));
}
const loadScript=u=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function makeDetector(){
 if("BarcodeDetector" in window){
  try{const d=new BarcodeDetector({formats:["ean_13"]});return async v=>{const r=await d.detect(v);return r[0]&&r[0].rawValue}}catch(e){}
 }
 try{
  if(!window.ZXing)await loadScript("https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js");
  const Z=window.ZXing,h=new Map();
  h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13]);h.set(Z.DecodeHintType.TRY_HARDER,true);
  const rd=new Z.MultiFormatReader();rd.setHints(h);
  const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
  return async v=>{
   if(!v.videoWidth)return null;
   const w=Math.min(960,v.videoWidth),k=w/v.videoWidth;cv.width=w;cv.height=Math.round(v.videoHeight*k);
   cx.drawImage(v,0,0,cv.width,cv.height);
   try{return rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))).getText()}catch(e){return null}
  };
 }catch(e){return null}
}

const blank=()=>({id:"b"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),isbn:"",title:"",series:"",cat:"",vol:null,author:"",price:"",cover:"",note:"",date:Date.now()});
const tmo=(u,o={},ms=6000)=>{const c=new AbortController();setTimeout(()=>c.abort(),ms);return fetch(u,{...o,signal:c.signal})};
const imgOK=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i.naturalWidth>40);i.onerror=()=>r(false);i.src=u});
const lookupBase=()=>PROXY||(cfg.url?cfg.url.replace(/\/+$/,"")+"/?code=":"");
const SRC=[
 ["自訂代理",async i=>{const b=lookupBase();if(!b)return null;return await (await tmo(b+i,{},15000)).json()}],
 ["Google Books",async i=>{
  const j=await (await tmo("https://www.googleapis.com/books/v1/volumes?q=isbn:"+i)).json();const it=j.items&&j.items[0];if(!it)return null;
  const v=it.volumeInfo,p=it.saleInfo&&it.saleInfo.listPrice;
  const im=v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail);
  return{title:v.title+(v.subtitle?" "+v.subtitle:""),author:(v.authors||[]).join("、"),price:p?p.currencyCode+" "+p.amount:"",cover:im?im.replace("http:","https:").replace("&edge=curl",""):""}}],
 ["Open Library",async i=>{
  const j=await (await tmo("https://openlibrary.org/api/books?format=json&jscmd=data&bibkeys=ISBN:"+i)).json();const v=j["ISBN:"+i];
  const c="https://covers.openlibrary.org/b/isbn/"+i+"-L.jpg?default=false";
  const hasC=await imgOK(c);
  if(!v&&!hasC)return null;
  return{title:v?v.title:"",author:v?(v.authors||[]).map(a=>a.name).join("、"):"",cover:hasC?c:""}}],
 ["NDL（日本國會圖書館）",async i=>{
  const x=new DOMParser().parseFromString(await (await tmo("https://ndlsearch.ndl.go.jp/api/opensearch?isbn="+i)).text(),"text/xml");
  const it=x.querySelector("item");const t=it&&it.getElementsByTagName("dc:title")[0];
  const c="https://ndlsearch.ndl.go.jp/thumbnail/"+i+".jpg";const hasC=await imgOK(c);
  if(!t&&!hasC)return null;
  const a=it&&it.getElementsByTagName("dc:creator")[0];
  return{title:t?t.textContent.trim():"",author:a?a.textContent.trim():"",cover:hasC?c:""}}]
];
async function lookup(isbn){
 const out={title:"",author:"",price:"",cover:""},used=[];
 for(const [name,fn] of SRC){
  if(out.title&&out.cover&&out.author)break;
  const sm=$("#sm");if(sm)sm.textContent="查詢中："+name+"…";
  try{const r=await fn(isbn);if(!r)continue;let hit=false;
   for(const k in out)if(!out[k]&&r[k]){out[k]=r[k];hit=true}
   if(hit)used.push(name)}catch(e){}
 }
 if(!out.title&&!out.cover)return null;
 out._src=used.join(" + ");return out;
}
async function found(isbn){
 stopScan();$("#sm")&&($("#sm").textContent="辨識成功："+isbn+"，查詢書籍資料中…");
 const r=await lookup(isbn);draft=blank();draft.isbn=isbn;
 if(r){Object.assign(draft,{title:r.title||"",author:r.author||"",price:r.price||"",cover:r.cover||"",_src:r._src});
  const gs=guessFromTitle(draft.title);draft.series=gs.series;draft.vol=gs.vol;draft.cat=gs.cat;
  if(!draft.author){const m=books.find(x=>skey(x)===skeyS(gs.series)&&x.author);if(m)draft.author=m.author}}
 draft._miss=!r;location.hash="#/edit/new";
}

// ===== 跨裝置同步（Cloudflare Worker + KV）=====
let syncing=false,again=false,syncTimer=null;
const isData=s=>typeof s==="string"&&s.startsWith("data:");
const pub=b=>{const o={...b};delete o._up;if(isData(o.cover))delete o.cover;return o};
const setSync=st=>{const el=$("#cfg");if(!el)return;el.classList.toggle("syncing",st==="busy");el.classList.toggle("err",st==="err")};
function schedSync(){if(!cfg.url||!cfg.token)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(),1500)}
async function api(path,opt={}){
 const r=await fetch(cfg.url.replace(/\/+$/,"")+path,{...opt,headers:{authorization:"Bearer "+cfg.token,"content-type":"application/json"}});
 if(r.status===401)throw new Error("同步密碼不正確");
 if(r.status===501)throw new Error("Worker 尚未設定 KV 或 SYNC_TOKEN");
 if(!r.ok&&r.status!==404)throw new Error("伺服器錯誤（"+r.status+"）");
 return r;
}
async function sync(){
 if(!cfg.url||!cfg.token)return;
 if(syncing){again=true;return}
 syncing=true;setSync("busy");const r0=rev;let failed=false;
 try{
  const r=await api("/sync",{method:"POST",body:JSON.stringify({books:[...books.map(pub),...tombs]})});
  const merged=(await r.json()).books||[];
  const loc=new Map(books.map(b=>[b.id,b])),hc=new Map(),nb=[],nt=[];
  for(const m of merged){
   if(m.deleted){nt.push({id:m.id,deleted:true,updatedAt:m.updatedAt});continue}
   const l=loc.get(m.id);hc.set(m.id,!!m.hasCover);
   const rec={...m};delete rec.hasCover;
   if(!rec.cover||isData(rec.cover))rec.cover=(l&&l.cover)||"";
   rec._up=!!(l&&l._up&&l.coverAt===m.coverAt);
   nb.push(rec);
  }
  for(const b of nb)if(b._up&&isData(b.cover)){
   const u=await api("/cover/"+b.id,{method:"PUT",body:JSON.stringify({cover:b.cover})});
   if(u.ok){b._up=false;hc.set(b.id,true)}
  }
  const need=nb.filter(b=>{const l=loc.get(b.id);return hc.get(b.id)&&!b._up&&!(l&&isData(l.cover)&&l.coverAt===b.coverAt)});
  for(let i=0;i<need.length;i+=3)await Promise.all(need.slice(i,i+3).map(async b=>{
   const c=await api("/cover/"+b.id);if(c.ok){const j=await c.json();if(j.cover)b.cover=j.cover}
  }));
  if(rev!==r0){again=true;return}
  books=nb;tombs=nt;persist();
  cfg.last=Date.now();cfg.err="";saveCfg();
  const h=location.hash;if(h===""||h==="#/"||h.startsWith("#/series"))route();
 }catch(e){failed=true;cfg.err=String(e.message||e);saveCfg()}
 finally{syncing=false;setSync(failed?"err":"ok");if(again){again=false;setTimeout(sync,300)}}
}
function statusText(){
 if(!cfg.url||!cfg.token)return "尚未啟用同步。";
 return cfg.err?"上次同步失敗："+cfg.err:cfg.last?"連線正常，上次同步：" +new Date(cfg.last).toLocaleString("zh-TW"):"尚未同步。";
}

  await sync();$("#s_msg")&&($("#s_msg").textContent=statusText());
 };
 $("#s_off").onclick=()=>{cfg={};saveCfg();setSync("ok");$("#s_url").value="";$("#s_tok").value="";$("#s_msg").textContent="已停用同步（本機資料保留）。"};
 $("#x_out").onclick=()=>{
  const blob=new Blob([JSON.stringify({v:1,books,tombs})],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="bookshelf-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();
 };
 $("#x_in").onclick=()=>$("#x_f").click();
 $("#x_f").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
   const d=JSON.parse(await f.text());if(!Array.isArray(d.books))throw 0;
   const ids=new Map(books.map(b=>[b.id,b]));let n=0;
   for(const b of d.books){if(!b||!b.id)continue;const o=ids.get(b.id);
    if(!o||(b.updatedAt||b.date||0)>(o.updatedAt||0)){
     if(o)books=books.filter(x=>x.id!==b.id);
     tombs=tombs.filter(t=>t.id!==b.id);
     b.updatedAt??=b.date||Date.now();if(isData(b.cover)){b.coverAt??=b.updatedAt;b._up=true}
     books.push(b);n++}}
   save();alert("已還原 "+n+" 本書");
  }catch(err){alert("這不是有效的備份檔")}
  e.target.value="";
 };
}

// ===== 初始化 =====
const themeIcon=()=>{$("#theme").innerHTML=ic(document.documentElement.dataset.theme==="dark"?"sun":"moon")};
$("#back").innerHTML=ic("back");$("#cfg").innerHTML=ic("sliders");$("#fab").innerHTML=ic("scan",22)+"<span>掃描入庫</span>";themeIcon();
$("#theme").onclick=()=>{const r=document.documentElement,t=r.dataset.theme==="dark"?"light":"dark";r.dataset.theme=t;try{localStorage.setItem("bookshelf.theme",t)}catch(e){}themeIcon()};
$("#cfg").onclick=()=>location.hash="#/settings";
$("#fab").onclick=()=>location.hash="#/add";
$("#back").onclick=()=>{if(draft&&location.hash.startsWith("#/edit"))draft=null;history.length>1&&!location.hash.startsWith("#/edit")?history.back():(location.hash="#/")};
document.addEventListener("click",e=>{
 const rs=e.target.closest("[data-rnseries]");if(rs)return renameSeries(rs.dataset.rnseries);
 const rc=e.target.closest("[data-rncat]");if(rc)return renameCat(rc.dataset.sk,rc.dataset.rncat);
 const c=e.target.closest("[data-go]");if(c)location.hash=c.dataset.go;
});
addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync()});
addEventListener("online",()=>sync());
addEventListener("hashchange",route);
route();sync();
</script>
